<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>マスターモード</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    .master-main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .section-title {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-grid .btn { font-size: 0.82rem; }
    .btn--wide { grid-column: 1 / -1; }
    .log {
      flex: 1;
      min-height: 120px;
      padding: 0.65rem;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      color: var(--muted);
      overflow-y: auto;
    }
    .log p { margin: 0 0 0.35rem; }
    .btn.is-active {
      background: #2f8f46;
      border-color: #2f8f46;
      color: #ffffff;
    }
    .relay-row { display: flex; gap: 6px; margin-top: 6px; }
    .relay-row input {
      flex: 1;
      min-width: 0;
      padding: 0.55rem;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .relay-row .btn { width: auto; flex-shrink: 0; }
    .video-mode-hint {
      margin: 0.4rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-header__title">マスターモード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <main class="master-main">
      <section>
        <h2 class="section-title">映像ソース（全画面）</h2>
        <div class="btn-grid">
          <button type="button" class="btn" data-video-mode="file">動画ファイル</button>
          <button type="button" class="btn" data-video-mode="webrtc">WebRTC（実機カメラ）</button>
        </div>
        <div class="relay-row">
          <input id="relayInput" type="text" placeholder="中継先（例: 192.168.1.50 / ws://host:8080/ws）空欄で自動" />
          <button type="button" class="btn" id="relaySet">中継先を設定</button>
        </div>
        <p class="video-mode-hint" id="videoModeHint">現在: 動画ファイル（1〜5号機 → カメラID RES1〜RES5）</p>
      </section>
      <section>
        <h2 class="section-title">アナリティクス — 解析データ投入</h2>
        <div class="btn-grid">
          <button type="button" class="btn" data-preset="A">ルームA 解析セット</button>
          <button type="button" class="btn" data-preset="B">ルームB 解析セット</button>
          <button type="button" class="btn" data-preset="C">ルームC 解析セット</button>
          <button type="button" class="btn" data-action="clear_analysis">解析クリア</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">アナリティクス — 対象機体</h2>
        <div class="btn-grid">
          <button type="button" class="btn" data-unit="1">1号機を解析対象</button>
          <button type="button" class="btn" data-unit="2">2号機を解析対象</button>
          <button type="button" class="btn" data-unit="3">3号機を解析対象</button>
          <button type="button" class="btn" data-unit="4">4号機を解析対象</button>
          <button type="button" class="btn btn--wide" data-unit="5">5号機を解析対象</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">撮影オーバーレイ（アナリティクス画面）</h2>
        <div class="btn-grid">
          <button type="button" class="btn" data-overlay="scene1">シーン1 指示表示</button>
          <button type="button" class="btn" data-overlay="scene2">シーン2 指示表示</button>
          <button type="button" class="btn btn--wide" data-action="hide_overlay">オーバーレイ非表示</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">コントロール — タスク</h2>
        <div class="btn-grid">
          <button type="button" class="btn" data-next-room="">共通 次を完了</button>
          <button type="button" class="btn" data-next-room="A">ルームA 次を完了</button>
          <button type="button" class="btn" data-next-room="B">ルームB 次を完了</button>
          <button type="button" class="btn" data-next-room="C">ルームC 次を完了</button>
          <button type="button" class="btn btn--wide" data-action="reset">全体リセット</button>
        </div>
      </section>
      <div class="log" id="log" aria-live="polite"></div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;
      const logEl = document.getElementById("log");
      const connBadge = document.getElementById("connBadge");

      const PRESETS = {
        A: {
          stove: "ストーブ無し",
          injury: "右手足負傷",
          color: "青色",
          audio: "音声500Hz",
          pattern: "パターン：〇×○○×〇×",
          notes: "以上、送信要求",
          status: "解析中",
        },
        B: {
          stove: "ストーブあり",
          injury: "左手負傷",
          color: "赤色",
          audio: "音声400Hz",
          pattern: "",
          notes: "以上、送信要求",
          status: "解析中",
        },
        C: {
          stove: "未報告",
          injury: "歩行不可",
          color: "緑色",
          audio: "音声600Hz",
          pattern: "パターン：×○×○×○×",
          notes: "以上、送信要求",
          status: "解析中",
        },
      };

      const OVERLAYS = {
        scene1: {
          title: "撮影指示 — シーン1",
          lines: [
            "解析担当：ルームA の報告を入力してください",
            "被災者の色・音声パターンを確認",
          ],
        },
        scene2: {
          title: "撮影指示 — シーン2",
          lines: [
            "エンジニア：2号機の通信状態を確認",
            "操縦：搬送経路確保タスクへ移行",
          ],
        },
      };

      function log(msg) {
        const p = document.createElement("p");
        p.textContent = new Date().toLocaleTimeString("ja-JP") + " — " + msg;
        logEl.insertBefore(p, logEl.firstChild);
      }

      const relayInput = document.getElementById("relayInput");
      const videoModeHint = document.getElementById("videoModeHint");

      const client = RC.createWsClient("master", {
        onStatus: function (s) {
          RC.setConnBadge(connBadge, s);
        },
        onState: function (st) {
          const mode = st.video_mode || "file";
          const server = st.webrtc_server || "";
          document.querySelectorAll("[data-video-mode]").forEach(function (b) {
            b.classList.toggle("is-active", b.dataset.videoMode === mode);
          });
          videoModeHint.textContent =
            "現在: " +
            (mode === "webrtc" ? "WebRTC（実機カメラ）" : "動画ファイル") +
            "（1〜5号機 → カメラID RES1〜RES5）" +
            (server ? "　中継: " + server : "");
          if (document.activeElement !== relayInput && server) relayInput.value = server;
        },
      });

      function postMaster(body) {
        fetch("/api/master", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function () {
          log(body.action || JSON.stringify(body));
        });
      }

      document.querySelectorAll("[data-video-mode]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const mode = btn.dataset.videoMode;
          postMaster({ action: "set_video_mode", mode: mode });
          log("映像ソース → " + (mode === "webrtc" ? "WebRTC（実機カメラ）" : "動画ファイル"));
        });
      });

      document.getElementById("relaySet").addEventListener("click", function () {
        const v = relayInput.value.trim();
        postMaster({ action: "set_webrtc_server", server: v });
        log("WebRTC中継先 → " + (v || "(自動推定)"));
      });

      document.querySelectorAll("[data-preset]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const key = btn.dataset.preset;
          postMaster({
            action: "set_analysis",
            preset: PRESETS[key],
            status: "解析中",
          });
          log("解析セット " + key + " を投入");
        });
      });

      document.querySelectorAll("[data-unit]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const unit = parseInt(btn.dataset.unit, 10);
          postMaster({ action: "set_analytics_target", unit: unit });
          log(unit + "号機を解析対象に設定");
        });
      });

      document.querySelectorAll("[data-overlay]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const ov = OVERLAYS[btn.dataset.overlay];
          postMaster({
            action: "show_overlay",
            title: ov.title,
            lines: ov.lines,
          });
          log("オーバーレイ表示: " + ov.title);
        });
      });

      document.querySelectorAll("[data-next-room]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const room = btn.dataset.nextRoom;
          postMaster({ action: "complete_next", room: room });
          log((room ? "ルーム" + room : "共通") + " の次のタスクを完了");
        });
      });

      document.querySelectorAll("[data-action]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const action = btn.dataset.action;
          if (action === "hide_overlay") {
            postMaster({ action: "hide_overlay" });
            log("オーバーレイ非表示");
          } else if (action === "clear_analysis") {
            postMaster({
              action: "set_analysis",
              preset: {
                stove: "",
                injury: "",
                color: "",
                audio: "",
                pattern: "",
                notes: "",
              },
              status: "待機中",
            });
            log("解析データをクリア");
          } else if (action === "reset") {
            if (confirm("全状態をリセットしますか？")) {
              postMaster({ action: "reset" });
              log("全体リセット");
            }
          }
        });
      });
    })();
  </script>
  <script src="/voice/voice-client.js"></script>
  <script>VoiceComm.init({ role: "マスター" });</script>
</body>
</html>
