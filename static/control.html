<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コントロールモード</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    .notify-bar {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      transition: background 0.3s;
    }
    .notify-bar.is-active {
      background: #c46a1a;
      animation: notifyPulse 1.2s ease-in-out 3;
    }
    .notify-bar__empty { color: var(--muted); font-weight: 400; }
    @keyframes notifyPulse {
      0%, 100% { background: #c46a1a; }
      50% { background: #e8943a; }
    }
    .control-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 0;
    }
    .right-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-col .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-col .panel--units {
      flex: 1;
    }
    .unit-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      overflow-y: auto;
    }
    .unit-btn {
      display: block;
      width: 100%;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .unit-btn:hover:not(:disabled):not(.is-requested) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .unit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .unit-btn.is-operating {
      background: #2fa8d8;
      border-color: #2fa8d8;
    }
    .unit-btn.is-operating .unit-btn__name {
      color: #ffffff;
    }
    .unit-btn.is-operating .unit-btn__conn {
      color: rgba(255, 255, 255, 0.9);
    }
    .ctrl-select {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
    }
    .ctrl-btn {
      display: block;
      width: 100%;
      padding: 0.45rem 0.6rem;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .ctrl-btn:hover:not(.is-selected) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .ctrl-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .ctrl-empty {
      padding: 0.45rem 0.6rem;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .unit-btn.is-requested {
      background: #c46a1a;
      animation: requestPulse 1.2s ease-in-out infinite;
    }
    .unit-btn__row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .unit-btn__name {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .unit-btn__badge {
      flex-shrink: 0;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 9px;
      color: #ffffff;
      white-space: nowrap;
    }
    .unit-btn__badge--self {
      background: #2f8f46;
      animation: badgeBlink 1s ease-in-out infinite;
    }
    .unit-btn__badge--other {
      background: #6a6a72;
    }
    .unit-btn__badge--disabled {
      background: var(--danger);
    }
    .unit-btn.is-disabled .unit-btn__name {
      color: var(--danger);
    }
    @keyframes badgeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .unit-btn__conn {
      display: block;
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .unit-btn.is-requested .unit-btn__conn {
      color: rgba(255, 255, 255, 0.85);
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px;
      overflow-y: auto;
    }
    .task-group {
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .task-group__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.6rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .task-group__title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }
    .task-group__badge {
      flex-shrink: 0;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 7px;
      border: 1px solid var(--warn);
      border-radius: 9px;
      background: var(--warn);
      color: #ffffff;
      white-space: nowrap;
    }
    .task-group__count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .task-group__count.is-complete { color: var(--ok); }
    .task-group__bar {
      height: 3px;
      background: var(--surface2);
    }
    .task-group__bar i {
      display: block;
      height: 100%;
      background: var(--ok);
      transition: width 0.3s;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
    }
    .task-row:not(.is-done):hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .task-row.is-done {
      cursor: default;
    }
    .task-row:first-child { border-top: none; }
    .task-row__check {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      line-height: 1;
      color: transparent;
    }
    .task-row.is-done .task-row__check {
      background: var(--ok);
      border-color: var(--ok);
      color: #1e1e22;
    }
    .task-row.is-done {
      color: var(--muted);
    }
    .task-row.is-done .task-row__label {
      text-decoration: line-through;
    }
    .task-row.is-current {
      background: rgba(91, 155, 213, 0.16);
      border-left: 3px solid var(--accent);
      padding-left: calc(0.6rem - 3px);
    }
    .task-row.is-current .task-row__check {
      border-color: var(--accent);
    }
    .center-video {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .center-video #mainVideo {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 4px;
      padding: 4px;
    }
    .center-video .video-box {
      flex: 1;
      min-height: 0;
    }
    .center-video #mainVideo .video-box video {
      object-fit: contain;
    }
    .analysis-tab {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .analysis-tab__body {
      display: flex;
      min-height: 0;
    }
    .analysis-rooms {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      border-right: 1px solid var(--border);
    }
    .room-btn {
      display: block;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .room-btn:hover:not(.is-selected) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .room-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .analysis-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    .analysis-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .analysis-row__label {
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 3.2rem;
    }
    .analysis-row__value {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .color-btns {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .color-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.55rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .color-btn:hover:not(.is-selected) {
      border-color: var(--accent);
    }
    .color-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .color-btn__swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }
    .confirm-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: #d97a1f;
      border: 1px solid #d97a1f;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .confirm-btn:hover { background: #e8943a; border-color: #e8943a; }
    .confirm-btn.is-confirmed {
      background: #2f8f46;
      border-color: #2f8f46;
      color: #ffffff;
    }
    .confirm-btn.is-flash {
      background: #2f8f46;
      border-color: #2f8f46;
      color: #ffffff;
    }
    .confirm-btn--spacer {
      visibility: hidden;
      cursor: default;
    }
    .key-banner {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 38px;
      padding: 0.35rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .key-banner__item.is-active {
      color: var(--accent);
      font-weight: 700;
    }
    .key-banner kbd {
      display: inline-block;
      min-width: 1.4rem;
      margin-right: 0.35rem;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      text-align: center;
    }
    .center-video .panel-title span {
      color: var(--accent);
    }
    .control-request-bar {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 52px;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #c46a1a;
      font-size: 1.05rem;
      font-weight: 700;
      animation: requestPulse 1.2s ease-in-out infinite;
    }
    .control-request-bar.is-visible {
      display: flex;
    }
    .control-request-bar__hint {
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }
    @keyframes requestPulse {
      0%, 100% { background: #c46a1a; }
      50% { background: #e8943a; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-header__title">コントロールモード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <div class="notify-bar" id="notifyBar" aria-live="polite">
      <span class="notify-bar__empty" id="notifyText">通知はありません</span>
    </div>
    <div class="control-request-bar" id="controlRequestBar" aria-live="assertive">
      <span id="controlRequestText">操縦要請　1号機</span>
      <span class="control-request-bar__hint">Enter で承諾</span>
    </div>
    <main class="app-main control-body">
      <section class="panel">
        <h2 class="panel-title">タスク進行状況</h2>
        <div class="task-list" id="taskList"></div>
      </section>
      <section class="panel center-video">
        <h2 class="panel-title">ロボットカメラ — <span id="videoUnitLabel">操作機 + 天カメ</span></h2>
        <div id="mainVideo"></div>
        <div class="analysis-tab">
          <h2 class="panel-title">解析結果</h2>
          <div class="analysis-tab__body">
            <div class="analysis-rooms" id="analysisRooms">
              <button type="button" class="room-btn is-selected" data-room="A">ルームA（広場）</button>
              <button type="button" class="room-btn" data-room="B">ルームB(暗室)</button>
              <button type="button" class="room-btn" data-room="C">ルームC(2階)</button>
            </div>
            <div class="analysis-content">
              <div class="analysis-row">
                <button type="button" class="confirm-btn" id="qrConfirm">結果確定</button>
                <span class="analysis-row__label">QR：</span>
                <span class="analysis-row__value" id="qrStatus">読み取り中</span>
              </div>
              <div class="analysis-row">
                <button type="button" class="confirm-btn" id="colorConfirm">結果確定</button>
                <span class="analysis-row__label">顔色：</span>
                <div class="color-btns" id="colorBtns"></div>
              </div>
              <div class="analysis-row">
                <span class="confirm-btn confirm-btn--spacer" aria-hidden="true">結果確定</span>
                <span class="analysis-row__label">音声解析：</span>
                <span class="analysis-row__value" id="audioStatus">未完了</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="right-col">
        <section class="panel">
          <h2 class="panel-title">操作</h2>
          <div class="btn-row">
            <button type="button" class="btn" data-dummy>現場到着</button>
            <button type="button" class="btn" data-dummy>搬送開始</button>
            <button type="button" class="btn" data-dummy>再起動</button>
            <button type="button" class="btn" data-dummy>通信経路切替</button>
            <button type="button" class="btn" data-dummy>カメラ再起動</button>
          </div>
        </section>
        <section class="panel panel--units">
          <h2 class="panel-title">機体選択</h2>
          <div class="unit-select" id="unitSelect"></div>
        </section>
        <section class="panel">
          <h2 class="panel-title">コントローラ選択</h2>
          <div class="ctrl-select" id="ctrlSelect"></div>
        </section>
      </div>
    </main>
    <footer class="key-banner" id="keyBanner">
      <span class="key-banner__item"><kbd>1</kbd>〜<kbd>5</kbd>操作機切替</span>
      <span class="key-banner__item" data-mode="a"><kbd>7</kbd>操作機のみ</span>
      <span class="key-banner__item" data-mode="b"><kbd>8</kbd>天カメのみ</span>
      <span class="key-banner__item" data-mode="both"><kbd>9</kbd>2画面表示</span>
      <span class="key-banner__item"><kbd>Enter</kbd>操縦要請の承諾</span>
    </footer>
  </div>
  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;
      const notifyBar = document.getElementById("notifyBar");
      const notifyText = document.getElementById("notifyText");
      const taskList = document.getElementById("taskList");
      const mainVideo = document.getElementById("mainVideo");
      const videoUnitLabel = document.getElementById("videoUnitLabel");
      const connBadge = document.getElementById("connBadge");
      const controlRequestBar = document.getElementById("controlRequestBar");
      const controlRequestText = document.getElementById("controlRequestText");
      let lastNotifyTs = 0;
      let pendingRequestUnit = 0;

      function renderTaskRows(tasks) {
        let currentMarked = false;
        return tasks
          .map(function (t) {
            let cls = "";
            if (t.done) {
              cls = " is-done";
            } else if (!currentMarked) {
              cls = " is-current";
              currentMarked = true;
            }
            return (
              '<div class="task-row' +
              cls +
              '" data-task-id="' +
              t.id +
              '"><span class="task-row__check">✓</span>' +
              '<span class="task-row__label">' +
              RC.escapeHtml(t.text) +
              "</span></div>"
            );
          })
          .join("");
      }

      function renderTaskGroup(title, tasks, badge) {
        const done = tasks.filter(function (t) { return t.done; }).length;
        const total = tasks.length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const complete = done === total && total > 0;
        return (
          '<div class="task-group">' +
          '<div class="task-group__head"><span class="task-group__title"><span>' +
          RC.escapeHtml(title) +
          "</span>" +
          (badge
            ? '<span class="task-group__badge">' + RC.escapeHtml(badge) + "</span>"
            : "") +
          '</span><span class="task-group__count' +
          (complete ? " is-complete" : "") +
          '">' +
          done +
          "/" +
          total +
          "</span></div>" +
          '<div class="task-group__bar"><i style="width:' +
          pct +
          '%"></i></div>' +
          renderTaskRows(tasks) +
          "</div>"
        );
      }

      let roomUnits = { A: 4, B: 3, C: 5 };

      function renderTasks(tasks) {
        const list = tasks || [];
        const common = list.filter(function (t) { return !t.room; });
        const rooms = ["A", "B", "C"];
        let html = "";
        if (common.length) {
          html += renderTaskGroup("共通", common);
        }
        rooms.forEach(function (room) {
          const group = list.filter(function (t) { return t.room === room; });
          if (group.length) {
            const badge = roomUnits[room] ? roomUnits[room] + "号機対応中" : null;
            html += renderTaskGroup("ルーム" + room, group, badge);
          }
        });
        taskList.innerHTML = html;
      }

      taskList.addEventListener("click", function (e) {
        const row = e.target.closest(".task-row");
        if (!row || row.classList.contains("is-done")) return;
        const id = parseInt(row.dataset.taskId, 10);
        if (!id) return;
        client.send({ type: "complete_task", task_id: id });
      });

      const unitSelect = document.getElementById("unitSelect");

      function renderUnitSelect(st) {
        const units = st.units || {};
        const req = st.control_request || {};
        unitSelect.innerHTML = [1, 2, 3, 4, 5]
          .map(function (n) {
            const u = units[n] || {};
            const isSelf = n === st.control_operating_unit;
            const isOther = !!u.other_op && !isSelf;
            const isReq = !!req.pending && req.unit === n;
            let badge = "";
            if (u.disabled) {
              badge = '<span class="unit-btn__badge unit-btn__badge--disabled">行動不能</span>';
            } else if (isSelf) {
              badge = '<span class="unit-btn__badge unit-btn__badge--self">操縦中</span>';
            } else if (isOther) {
              badge = '<span class="unit-btn__badge unit-btn__badge--other">別オペ中</span>';
            }
            const dot = u.connected ? "status-dot--ok" : "status-dot--ng";
            const conn = u.disabled
              ? "行動不能"
              : u.connected
              ? RC.escapeHtml(u.method || "—") + " " + (u.delay_ms != null ? u.delay_ms + "ms" : "")
              : "切断";
            return (
              '<button type="button" class="unit-btn' +
              (isSelf ? " is-operating" : "") +
              (isReq ? " is-requested" : "") +
              (u.disabled ? " is-disabled" : "") +
              '" data-unit="' +
              n +
              '"><span class="unit-btn__row1"><span class="unit-btn__name">' +
              n +
              "号機</span>" +
              badge +
              '</span><span class="unit-btn__conn"><span class="status-dot ' +
              dot +
              '"></span>' +
              conn +
              "</span></button>"
            );
          })
          .join("");
      }

      // ---- 解析結果タブ ----
      const COLOR_OPTIONS = [
        { name: "不明", swatch: "#888888" },
        { name: "黒", swatch: "#111111" },
        { name: "赤", swatch: "#e85d5d" },
        { name: "緑", swatch: "#4caf50" },
        { name: "青", swatch: "#3b6fd4" },
        { name: "黄", swatch: "#e8c63a" },
        { name: "紫", swatch: "#9b59d0" },
        { name: "水", swatch: "#5bc8e8" },
        { name: "白", swatch: "#f5f5f5" },
      ];
      const analysisRooms = document.getElementById("analysisRooms");
      const colorBtns = document.getElementById("colorBtns");
      const qrConfirm = document.getElementById("qrConfirm");
      const colorConfirm = document.getElementById("colorConfirm");
      let analysisRoom = "A";

      function emptyRoom() {
        return { stove: "", stoveDone: false, injuryDone: false, color: "", colorDone: false, notes: "" };
      }
      let roomAnalysis = { A: emptyRoom(), B: emptyRoom(), C: emptyRoom() };
      function curRoom() { return roomAnalysis[analysisRoom]; }
      function pushRoom(fields) {
        const payload = { type: "set_room_analysis", room: analysisRoom };
        Object.keys(fields).forEach(function (k) { payload[k] = fields[k]; });
        client.send(payload);
      }

      function renderColorButtons() {
        const s = curRoom();
        colorBtns.innerHTML = COLOR_OPTIONS.map(function (c) {
          return (
            '<button type="button" class="color-btn' +
            (s.color === c.name ? " is-selected" : "") +
            '" data-color="' + c.name + '"' + (s.colorDone ? " disabled" : "") +
            '><span class="color-btn__swatch" style="background:' +
            c.swatch +
            '"></span>' +
            c.name +
            "</button>"
          );
        }).join("");
      }
      function renderConfirm(btn, done) {
        btn.textContent = done ? "撤回する" : "確定する";
        btn.classList.toggle("is-confirmed", done);
      }
      function renderAnalysisTab() {
        renderColorButtons();
        renderConfirm(qrConfirm, curRoom().injuryDone);
        renderConfirm(colorConfirm, curRoom().colorDone);
      }
      renderAnalysisTab();

      analysisRooms.addEventListener("click", function (e) {
        const btn = e.target.closest(".room-btn");
        if (!btn) return;
        analysisRoom = btn.dataset.room;
        analysisRooms.querySelectorAll(".room-btn").forEach(function (b) {
          b.classList.toggle("is-selected", b === btn);
        });
        renderAnalysisTab();
      });

      colorBtns.addEventListener("click", function (e) {
        const btn = e.target.closest(".color-btn");
        if (!btn || btn.disabled) return;
        curRoom().color = btn.dataset.color;
        renderColorButtons();
      });
      qrConfirm.addEventListener("click", function () {
        curRoom().injuryDone = !curRoom().injuryDone;
        renderConfirm(qrConfirm, curRoom().injuryDone);
        pushRoom({ injuryDone: curRoom().injuryDone });
      });
      colorConfirm.addEventListener("click", function () {
        curRoom().colorDone = !curRoom().colorDone;
        renderAnalysisTab();
        pushRoom({ color: curRoom().color, colorDone: curRoom().colorDone });
      });

      unitSelect.addEventListener("click", function (e) {
        const btn = e.target.closest(".unit-btn");
        if (!btn || btn.disabled) return;
        const unit = parseInt(btn.dataset.unit, 10);
        if (!unit) return;
        selectOperatingUnit(unit);
      });

      // ---- コントローラ選択 ----
      const ctrlSelect = document.getElementById("ctrlSelect");
      let selectedController = null;

      function listControllers() {
        const pads = navigator.getGamepads
          ? Array.from(navigator.getGamepads()).filter(Boolean)
          : [];
        return pads.map(function (p) {
          return { id: "pad-" + p.index, label: p.id };
        });
      }

      function renderControllers() {
        const items = listControllers();
        if (!items.length) {
          selectedController = null;
          ctrlSelect.innerHTML =
            '<p class="ctrl-empty">コントローラ未接続</p>';
          return;
        }
        if (
          !items.some(function (i) { return i.id === selectedController; })
        ) {
          selectedController = items[0].id;
        }
        ctrlSelect.innerHTML = items
          .map(function (i) {
            return (
              '<button type="button" class="ctrl-btn' +
              (i.id === selectedController ? " is-selected" : "") +
              '" data-ctrl="' +
              RC.escapeHtml(i.id) +
              '" title="' +
              RC.escapeHtml(i.label) +
              '">' +
              RC.escapeHtml(i.label) +
              "</button>"
            );
          })
          .join("");
      }

      renderControllers();
      window.addEventListener("gamepadconnected", renderControllers);
      window.addEventListener("gamepaddisconnected", renderControllers);

      ctrlSelect.addEventListener("click", function (e) {
        const btn = e.target.closest(".ctrl-btn");
        if (!btn) return;
        selectedController = btn.dataset.ctrl;
        renderControllers();
      });

      let viewMode = "both"; // "a" = 操作機のみ / "b" = 天カメのみ / "both" = 2画面
      let videoUnitA = 1;

      const OVERHEAD_UNIT = 1; // 天カメ = 1号機のカメラ

      function overheadBox() {
        return RC.videoBox(OVERHEAD_UNIT, "", { label: "天カメ（1号機）" });
      }

      function renderVideo() {
        let html;
        let label;
        if (viewMode === "a") {
          html = RC.videoBox(videoUnitA);
          label = "操作機（" + videoUnitA + "号機）";
        } else if (viewMode === "b") {
          html = overheadBox();
          label = "天カメ（1号機）";
        } else {
          html = RC.videoBox(videoUnitA) + overheadBox();
          label = "操作機（" + videoUnitA + "号機）＋ 天カメ";
        }
        videoUnitLabel.textContent = label;
        mainVideo.classList.toggle("is-dual", viewMode === "both");
        mainVideo.innerHTML = html;
        RC.initVideos(mainVideo);
        document.querySelectorAll("#keyBanner [data-mode]").forEach(function (el) {
          el.classList.toggle("is-active", el.dataset.mode === viewMode);
        });
      }

      function setViewMode(mode) {
        if (mode === viewMode) return;
        viewMode = mode;
        renderVideo();
      }

      renderVideo();

      function showNotification(n) {
        if (!n || !n.text) {
          notifyText.textContent = "通知はありません";
          notifyText.className = "notify-bar__empty";
          notifyBar.classList.remove("is-active");
          return;
        }
        notifyText.textContent = n.text;
        notifyText.className = "";
        if (n.active && n.timestamp !== lastNotifyTs) {
          lastNotifyTs = n.timestamp;
          notifyBar.classList.remove("is-active");
          void notifyBar.offsetWidth;
          notifyBar.classList.add("is-active");
          setTimeout(function () {
            notifyBar.classList.remove("is-active");
          }, 3600);
        }
      }

      const client = RC.createWsClient("control", {
        onStatus: function (s) {
          RC.setConnBadge(connBadge, s);
        },
        onState: function (st) {
          roomUnits = st.room_units || roomUnits;
          if (st.room_analysis) {
            roomAnalysis = st.room_analysis;
            renderAnalysisTab();
          }
          renderTasks(st.tasks);
          renderUnitSelect(st);
          if (st.control_operating_unit !== videoUnitA) {
            videoUnitA = st.control_operating_unit;
            renderVideo();
          }
          showNotification(st.notification);

          const req = st.control_request || {};
          if (req.pending && req.unit >= 1 && req.unit <= 5) {
            pendingRequestUnit = req.unit;
            controlRequestText.textContent = "操縦要請　" + req.unit + "号機";
            controlRequestBar.classList.add("is-visible");
          } else {
            pendingRequestUnit = 0;
            controlRequestBar.classList.remove("is-visible");
          }
        },
      });

      function selectOperatingUnit(unit) {
        if (pendingRequestUnit === unit) {
          client.send({ type: "accept_control_request" });
          return;
        }
        client.send({ type: "set_control_operating", unit: unit });
        client.send({ type: "set_control_video", unit: unit });
      }

      document.addEventListener("keydown", function (e) {
        if (e.target.matches("input, textarea")) return;

        if (e.key >= "1" && e.key <= "5") {
          e.preventDefault();
          selectOperatingUnit(parseInt(e.key, 10));
          return;
        }
        if (e.key === "7") {
          e.preventDefault();
          setViewMode("a");
          return;
        }
        if (e.key === "8") {
          e.preventDefault();
          setViewMode("b");
          return;
        }
        if (e.key === "9") {
          e.preventDefault();
          setViewMode("both");
          return;
        }

        if (e.key !== "Enter") return;
        if (e.target.matches("button")) return;
        if (!pendingRequestUnit) return;
        e.preventDefault();
        client.send({ type: "accept_control_request" });
      });

      document.querySelectorAll("[data-dummy]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          btn.style.background = "#55555e";
          setTimeout(function () {
            btn.style.background = "";
          }, 150);
        });
      });
    })();
  </script>
  <script src="/voice/voice-client.js"></script>
  <script>VoiceComm.init({ role: "操縦" });</script>
</body>
</html>
