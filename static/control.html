<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コントロールモード</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    /* 通知バー・タスク進行状況は common.css の共通スタイルを使用 */
    .control-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 0;
    }
    /* 左列（タスク＋暗室座標）：タスクをスクロール、暗室座標マップを下部に固定表示 */
    .control-body > .panel:first-child {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-col .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-col .panel--units {
      flex: 1;
    }
    /* コントローラ選択パネルも高さ配分を確保し、機体選択と残り空間を折半。
       中身が多くてもパネルが潰れず、必要ならスクロールで全選択肢を表示する。 */
    .right-col .panel--ctrl {
      flex: 1;
    }
    .unit-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      overflow-y: auto;
    }
    .unit-btn {
      display: block;
      width: 100%;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .unit-btn:hover:not(:disabled):not(.is-requested) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .unit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .unit-btn.is-operating {
      background: #2fa8d8;
      border-color: #2fa8d8;
    }
    .unit-btn.is-operating .unit-btn__name {
      color: #ffffff;
    }
    .unit-btn.is-operating .unit-btn__conn {
      color: rgba(255, 255, 255, 0.9);
    }
    .ctrl-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      overflow-y: auto;
    }
    .ctrl-btn {
      display: block;
      width: 100%;
      padding: 0.45rem 0.6rem;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .ctrl-btn:hover:not(.is-selected) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .ctrl-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .ctrl-empty {
      padding: 0.45rem 0.6rem;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .joy-ws {
      padding: 5px 6px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .joy-ws__dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .joy-ws__dot--ok { background: #4f4; }
    .joy-ws__dot--connecting { background: #fa0; }
    .joy-ws__dot--err { background: #f44; }
    .joy-ws__label {
      font-size: 0.72rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .unit-btn.is-requested {
      background: #c46a1a;
      animation: requestPulse 1.2s ease-in-out infinite;
    }
    .unit-btn__row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .unit-btn__name {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .unit-btn__badge {
      flex-shrink: 0;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 9px;
      color: #ffffff;
      white-space: nowrap;
    }
    .unit-btn__badge--self {
      background: #2f8f46;
      animation: badgeBlink 1s ease-in-out infinite;
    }
    .unit-btn__badge--other {
      background: #6a6a72;
    }
    .unit-btn__badge--disabled {
      background: var(--danger);
    }
    .unit-btn.is-disabled .unit-btn__name {
      color: var(--danger);
    }
    @keyframes badgeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .unit-btn__conn {
      display: block;
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .unit-btn.is-requested .unit-btn__conn {
      color: rgba(255, 255, 255, 0.85);
    }
    .center-video {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .center-video #mainVideo {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 4px;
      padding: 4px;
    }
    .center-video .video-box {
      flex: 1;
      min-height: 0;
    }
    .center-video #mainVideo .video-box video {
      object-fit: contain;
    }
    .analysis-tab {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .analysis-tab__body {
      display: flex;
      min-height: 0;
    }
    .analysis-rooms {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      border-right: 1px solid var(--border);
    }
    .room-btn {
      display: block;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .room-btn:hover:not(.is-selected) {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(91, 155, 213, 0.6);
    }
    .room-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .analysis-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    .analysis-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .analysis-row__label {
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 3.2rem;
    }
    .analysis-row__value {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .color-btns {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .color-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.55rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .color-btn:hover:not(.is-selected) {
      border-color: var(--accent);
    }
    .color-btn.is-selected {
      background: #2fa8d8;
      border-color: #2fa8d8;
      color: #ffffff;
      font-weight: 700;
    }
    .color-btn__swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }
    .confirm-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: #d97a1f;
      border: 1px solid #d97a1f;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .confirm-btn:hover { background: #e8943a; border-color: #e8943a; }
    .confirm-btn.is-confirmed {
      background: #2f8f46;
      border-color: #2f8f46;
      color: #ffffff;
    }
    .confirm-btn.is-flash {
      background: #2f8f46;
      border-color: #2f8f46;
      color: #ffffff;
    }
    .confirm-btn--spacer {
      visibility: hidden;
      cursor: default;
    }
    .key-banner {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 38px;
      padding: 0.35rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .key-banner__item.is-active {
      color: var(--accent);
      font-weight: 700;
    }
    .key-banner kbd {
      display: inline-block;
      min-width: 1.4rem;
      margin-right: 0.35rem;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      text-align: center;
    }
    .center-video .panel-title span {
      color: var(--accent);
    }
    .control-request-bar {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 52px;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #c46a1a;
      font-size: 1.05rem;
      font-weight: 700;
      animation: requestPulse 1.2s ease-in-out infinite;
    }
    .control-request-bar.is-visible {
      display: flex;
    }
    .control-request-bar__hint {
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }
    @keyframes requestPulse {
      0%, 100% { background: #c46a1a; }
      50% { background: #e8943a; }
    }
    /* 5号機自動走行ボタン：off=消灯 / armed=点滅 / lit=点灯 の3視覚状態 */
    .auto-run-btn { position: relative; }
    .auto-run-btn[data-state="off"] {
      color: var(--muted);
    }
    .auto-run-btn[data-state="armed"] {
      color: #ffffff;
      border-color: #e8943a;
      animation: autoRunBlink 1.1s ease-in-out infinite;
    }
    .auto-run-btn[data-state="armed"]:hover {
      box-shadow: 0 0 10px 2px rgba(232, 148, 58, 0.75);
    }
    .auto-run-btn[data-state="lit"] {
      color: #ffffff;
      background: #2f8f46;
      border-color: #37b357;
      box-shadow: 0 0 10px 2px rgba(47, 143, 70, 0.7);
    }
    .auto-run-btn[data-state="lit"]:hover {
      background: #35a052;
      border-color: #37b357;
    }
    @keyframes autoRunBlink {
      0%, 100% { background: #c46a1a; }
      50% { background: #e8943a; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-header__title">コントロールモード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <div class="notify-bar" id="notifyBar" aria-live="polite">
      <span class="notify-bar__empty" id="notifyText">通知はありません</span>
    </div>
    <div class="control-request-bar" id="controlRequestBar" aria-live="assertive">
      <span id="controlRequestText">操縦要請　1号機</span>
      <span class="control-request-bar__hint">Enter で承諾</span>
    </div>
    <main class="app-main control-body">
      <section class="panel">
        <h2 class="panel-title">タスク進行状況</h2>
        <div class="task-list task-list--clickable" id="taskList"></div>
        <div class="dark-room">
          <h2 class="panel-title">暗室座標（エンジニア指定）</h2>
          <div class="field-map" id="darkRoomMap"></div>
          <div class="dark-room__foot">
            <span class="dark-room__coord" id="darkRoomCoord">未設定</span>
          </div>
        </div>
      </section>
      <section class="panel center-video">
        <h2 class="panel-title">ロボットカメラ — <span id="videoUnitLabel">操作機 + 天カメ</span></h2>
        <div id="mainVideo"></div>
        <div class="analysis-tab">
          <h2 class="panel-title">解析結果</h2>
          <div class="analysis-tab__body">
            <div class="analysis-rooms" id="analysisRooms">
              <button type="button" class="room-btn is-selected" data-room="A">ルームA（広場）</button>
              <button type="button" class="room-btn" data-room="B">ルームB(暗室)</button>
              <button type="button" class="room-btn" data-room="C">ルームC(2階)</button>
            </div>
            <div class="analysis-content">
              <div class="analysis-row">
                <button type="button" class="confirm-btn" id="qrConfirm">結果確定</button>
                <span class="analysis-row__label">QR：</span>
                <span class="analysis-row__value" id="qrStatus">読み取り中</span>
              </div>
              <div class="analysis-row">
                <button type="button" class="confirm-btn" id="colorConfirm">結果確定</button>
                <span class="analysis-row__label">顔色：</span>
                <div class="color-btns" id="colorBtns"></div>
              </div>
              <div class="analysis-row">
                <span class="confirm-btn confirm-btn--spacer" aria-hidden="true">結果確定</span>
                <span class="analysis-row__label">音声解析：</span>
                <span class="analysis-row__value" id="audioStatus">未完了</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="right-col">
        <section class="panel">
          <h2 class="panel-title">操作</h2>
          <div class="btn-row">
            <button type="button" class="btn auto-run-btn" id="unit5AutoRun" data-state="off">5号機自動走行</button>
            <button type="button" class="btn" id="unitReboot">再起動</button>
            <button type="button" class="btn" id="unitShutdown">シャットダウン</button>
          </div>
        </section>
        <section class="panel panel--units">
          <h2 class="panel-title">機体選択</h2>
          <div class="unit-select" id="unitSelect"></div>
        </section>
        <section class="panel panel--ctrl">
          <h2 class="panel-title">コントローラ選択</h2>
          <div class="ctrl-select" id="ctrlSelect"></div>
          <div class="joy-ws">
            <span class="joy-ws__dot" id="joyWsDot"></span>
            <span class="joy-ws__label" id="joyWsStatus">joy: 未接続</span>
          </div>
        </section>
      </div>
    </main>
    <footer class="key-banner" id="keyBanner">
      <span class="key-banner__item"><kbd>1</kbd>〜<kbd>5</kbd>操作機切替</span>
      <span class="key-banner__item" data-mode="a"><kbd>7</kbd>操作機のみ</span>
      <span class="key-banner__item" data-mode="b"><kbd>8</kbd>天カメのみ</span>
      <span class="key-banner__item" data-mode="both"><kbd>9</kbd>2画面表示</span>
      <span class="key-banner__item"><kbd>Enter</kbd>操縦要請の承諾</span>
    </footer>
  </div>
  <script src="/static/jsqr.js"></script>
  <script src="/static/webrtc-camera.js"></script>
  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;
      const notifyBar = document.getElementById("notifyBar");
      const notifyText = document.getElementById("notifyText");
      const taskList = document.getElementById("taskList");
      const mainVideo = document.getElementById("mainVideo");
      const videoUnitLabel = document.getElementById("videoUnitLabel");
      const connBadge = document.getElementById("connBadge");
      const controlRequestBar = document.getElementById("controlRequestBar");
      const controlRequestText = document.getElementById("controlRequestText");
      let pendingRequestUnit = 0;

      let roomUnits = { A: 4, B: 3, C: 5 };

      /* 暗室座標（読み取り専用マップ・エンジニアが指定した位置を共有表示） */
      const darkRoomCoordEl = document.getElementById("darkRoomCoord");
      const darkRoomMap = RC.createFieldMap(document.getElementById("darkRoomMap"), {});
      function renderDarkRoom(coord, side) {
        darkRoomMap.setCoord(coord);
        darkRoomMap.setSide(side || null);
        darkRoomCoordEl.textContent = RC.formatCoord(coord);
      }

      /* 5号機自動走行ボタン（サーバー権威の unit5_auto_run を反映） */
      const unit5AutoRunBtn = document.getElementById("unit5AutoRun");
      function renderAutoRun(stateStr) {
        const s = stateStr === "armed" || stateStr === "lit" ? stateStr : "off";
        unit5AutoRunBtn.dataset.state = s;
      }
      unit5AutoRunBtn.addEventListener("click", function () {
        // off の場合はサーバー側で無視される（暗室座標未入力＝走行対象なし）。
        client.send({ type: "unit5_auto_run_toggle" });
      });

      function renderTasks(tasks) {
        RC.renderTasks(taskList, tasks, roomUnits);
      }

      taskList.addEventListener("click", function (e) {
        const row = e.target.closest(".task-row");
        if (!row || row.classList.contains("is-done")) return;
        const id = parseInt(row.dataset.taskId, 10);
        if (!id) return;
        client.send({ type: "complete_task", task_id: id });
      });

      const unitSelect = document.getElementById("unitSelect");

      function renderUnitSelect(st) {
        const units = st.units || {};
        const req = st.control_request || {};
        unitSelect.innerHTML = [1, 2, 3, 4, 5]
          .map(function (n) {
            const u = units[n] || {};
            const isSelf = n === st.control_operating_unit;
            const isOther = !!u.other_op && !isSelf;
            const isReq = !!req.pending && req.unit === n;
            let badge = "";
            if (u.disabled) {
              badge = '<span class="unit-btn__badge unit-btn__badge--disabled">行動不能</span>';
            } else if (isSelf) {
              badge = '<span class="unit-btn__badge unit-btn__badge--self">操縦中</span>';
            } else if (isOther) {
              badge = '<span class="unit-btn__badge unit-btn__badge--other">別オペ中</span>';
            }
            const dot = u.connected ? "status-dot--ok" : "status-dot--ng";
            const conn = u.disabled
              ? "行動不能"
              : u.connected
              ? RC.escapeHtml(u.method || "—") + " " + (u.delay_ms != null ? u.delay_ms + "ms" : "")
              : "切断";
            return (
              '<button type="button" class="unit-btn' +
              (isSelf ? " is-operating" : "") +
              (isReq ? " is-requested" : "") +
              (u.disabled ? " is-disabled" : "") +
              '" data-unit="' +
              n +
              '"><span class="unit-btn__row1"><span class="unit-btn__name">' +
              n +
              "号機</span>" +
              badge +
              '</span><span class="unit-btn__conn"><span class="status-dot ' +
              dot +
              '"></span>' +
              conn +
              "</span></button>"
            );
          })
          .join("");
      }

      // ---- 解析結果タブ ----
      const COLOR_OPTIONS = RC.COLOR_OPTIONS;
      const analysisRooms = document.getElementById("analysisRooms");
      const colorBtns = document.getElementById("colorBtns");
      const qrConfirm = document.getElementById("qrConfirm");
      const colorConfirm = document.getElementById("colorConfirm");
      const qrStatus = document.getElementById("qrStatus");
      let analysisRoom = "A";

      function emptyRoom() {
        return { stove: "", stoveDone: false, qr: "", injuryDone: false, color: "", colorDone: false, notes: "" };
      }
      let roomAnalysis = { A: emptyRoom(), B: emptyRoom(), C: emptyRoom() };
      const qrDetectedAt = { A: 0, B: 0, C: 0 };
      function curRoom() { return roomAnalysis[analysisRoom]; }
      function pushRoom(fields) {
        const payload = { type: "set_room_analysis", room: analysisRoom };
        Object.keys(fields).forEach(function (k) { payload[k] = fields[k]; });
        client.send(payload);
      }

      function renderColorButtons() {
        const s = curRoom();
        colorBtns.innerHTML = COLOR_OPTIONS.map(function (c) {
          return (
            '<button type="button" class="color-btn' +
            (s.color === c.name ? " is-selected" : "") +
            '" data-color="' + c.name + '"' + (s.colorDone ? " disabled" : "") +
            '><span class="color-btn__swatch" style="background:' +
            c.swatch +
            '"></span>' +
            c.name +
            "</button>"
          );
        }).join("");
      }
      function renderConfirm(btn, done) {
        btn.textContent = done ? "撤回する" : "確定する";
        btn.classList.toggle("is-confirmed", done);
      }
      function renderQr() {
        const s = curRoom();
        const ago = qrDetectedAt[analysisRoom]
          ? "（最終検出 " + RC.formatAgo(qrDetectedAt[analysisRoom]) + "）"
          : "";
        qrStatus.textContent = s.qr ? s.qr + ago : "読み取り中";
      }
      function renderAnalysisTab() {
        renderColorButtons();
        renderQr();
        renderConfirm(qrConfirm, curRoom().injuryDone);
        renderConfirm(colorConfirm, curRoom().colorDone);
      }
      renderAnalysisTab();
      setInterval(renderQr, 1000);

      /* メイン映像（操作機カメラ）をリアルタイムQR解析 */
      RC.createQrScanner(
        function () { return mainVideo.querySelector("video"); },
        function (text) {
          curRoom().qr = text;
          qrDetectedAt[analysisRoom] = Date.now();
          renderQr();
        },
        700
      );

      analysisRooms.addEventListener("click", function (e) {
        const btn = e.target.closest(".room-btn");
        if (!btn) return;
        analysisRoom = btn.dataset.room;
        analysisRooms.querySelectorAll(".room-btn").forEach(function (b) {
          b.classList.toggle("is-selected", b === btn);
        });
        renderAnalysisTab();
      });

      colorBtns.addEventListener("click", function (e) {
        const btn = e.target.closest(".color-btn");
        if (!btn || btn.disabled) return;
        curRoom().color = btn.dataset.color;
        renderColorButtons();
      });
      qrConfirm.addEventListener("click", function () {
        curRoom().injuryDone = !curRoom().injuryDone;
        renderConfirm(qrConfirm, curRoom().injuryDone);
        // 確定するまで QR テキストは他クライアントへ送らない
        pushRoom({ qr: curRoom().qr, injuryDone: curRoom().injuryDone });
      });
      colorConfirm.addEventListener("click", function () {
        curRoom().colorDone = !curRoom().colorDone;
        renderAnalysisTab();
        pushRoom({ color: curRoom().color, colorDone: curRoom().colorDone });
      });

      unitSelect.addEventListener("click", function (e) {
        const btn = e.target.closest(".unit-btn");
        if (!btn || btn.disabled) return;
        const unit = parseInt(btn.dataset.unit, 10);
        if (!unit) return;
        selectOperatingUnit(unit);
      });

      // ---- コントローラ選択 ----
      const ctrlSelect = document.getElementById("ctrlSelect");
      let selectedController = null;

      function listControllers() {
        const pads = navigator.getGamepads
          ? Array.from(navigator.getGamepads()).filter(Boolean)
          : [];
        return pads.map(function (p) {
          return { id: "pad-" + p.index, label: p.id };
        });
      }

      function renderControllers() {
        const items = listControllers();
        if (!items.length) {
          selectedController = null;
          ctrlSelect.innerHTML =
            '<p class="ctrl-empty">コントローラ未接続</p>';
          return;
        }
        if (
          !items.some(function (i) { return i.id === selectedController; })
        ) {
          selectedController = items[0].id;
        }
        ctrlSelect.innerHTML = items
          .map(function (i) {
            return (
              '<button type="button" class="ctrl-btn' +
              (i.id === selectedController ? " is-selected" : "") +
              '" data-ctrl="' +
              RC.escapeHtml(i.id) +
              '" title="' +
              RC.escapeHtml(i.label) +
              '">' +
              RC.escapeHtml(i.label) +
              "</button>"
            );
          })
          .join("");
      }

      renderControllers();
      window.addEventListener("gamepadconnected", renderControllers);
      window.addEventListener("gamepaddisconnected", renderControllers);

      ctrlSelect.addEventListener("click", function (e) {
        const btn = e.target.closest(".ctrl-btn");
        if (!btn) return;
        selectedController = btn.dataset.ctrl;
        renderControllers();
      });

      // ---- joy_node_web WebSocket（号機連動自動接続）----
      const joyWsDot = document.getElementById("joyWsDot");
      const joyWsStatus = document.getElementById("joyWsStatus");

      let joyWs = null;
      let joyCurrentIp = "";

      function setJoyDot(s) {
        joyWsDot.className = "joy-ws__dot" + (s ? " joy-ws__dot--" + s : "");
      }

      function connectJoy(ip) {
        if (joyWs) { joyWs.onclose = null; joyWs.close(); joyWs = null; }
        if (!ip) {
          setJoyDot("");
          joyWsStatus.textContent = "joy: 未接続";
          return;
        }
        const url = "ws://" + ip + ":8700/joys";
        setJoyDot("connecting");
        joyWsStatus.textContent = "joy: 接続中 (" + ip + ")";
        const ws = new WebSocket(url);
        ws.onopen = function () {
          joyWs = ws;
          setJoyDot("ok");
          joyWsStatus.textContent = "joy: " + ip;
        };
        ws.onclose = function () {
          joyWs = null;
          setJoyDot("err");
          joyWsStatus.textContent = "joy: 切断 (" + ip + ")";
        };
        ws.onerror = function () {};
      }

      setInterval(function () {
        if (!joyWs || joyWs.readyState !== WebSocket.OPEN) return;
        if (!selectedController) return;
        const idx = parseInt(selectedController.replace("pad-", ""), 10);
        const gp = navigator.getGamepads ? navigator.getGamepads()[idx] : null;
        if (!gp) return;
        joyWs.send(JSON.stringify({
          id: gp.id,
          axes: Array.from(gp.axes),
          buttons: gp.buttons.map(function (b) { return b.value; }),
        }));
      }, 50);

      let viewMode = "both"; // "a" = 操作機のみ / "b" = 天カメのみ / "both" = 2画面
      let videoUnitA = 1;
      let currentOperatingUnit = 1; // 操作中の号機（再起動/シャットダウン対象）
      let webrtcServer = "";

      const OVERHEAD_UNIT = 1; // 天カメ = 1号機のカメラ

      function overheadBox() {
        return RC.videoBox(OVERHEAD_UNIT, "", { label: "天カメ（1号機）" });
      }

      function renderVideo() {
        let html;
        let label;
        if (viewMode === "a") {
          html = RC.videoBox(videoUnitA);
          label = "操作機（" + videoUnitA + "号機）";
        } else if (viewMode === "b") {
          html = overheadBox();
          label = "天カメ（1号機）";
        } else {
          html = RC.videoBox(videoUnitA) + overheadBox();
          label = "操作機（" + videoUnitA + "号機）＋ 天カメ";
        }
        videoUnitLabel.textContent = label;
        mainVideo.classList.toggle("is-dual", viewMode === "both");
        mainVideo.innerHTML = html;
        RC.initVideos(mainVideo, webrtcServer);
        document.querySelectorAll("#keyBanner [data-mode]").forEach(function (el) {
          el.classList.toggle("is-active", el.dataset.mode === viewMode);
        });
      }

      function setViewMode(mode) {
        if (mode === viewMode) return;
        viewMode = mode;
        renderVideo();
      }

      renderVideo();

      const showNotification = RC.createNotifier(notifyBar, notifyText);

      const client = RC.createWsClient("control", {
        onStatus: function (s) {
          RC.setConnBadge(connBadge, s);
        },
        onState: function (st) {
          currentOperatingUnit = st.control_operating_unit || currentOperatingUnit;
          roomUnits = st.room_units || roomUnits;
          if (st.room_analysis) {
            roomAnalysis = st.room_analysis;
            renderAnalysisTab();
          }
          renderTasks(st.tasks);
          renderDarkRoom(st.dark_room_coord || null, st.field_side || null);
          renderAutoRun(st.unit5_auto_run);
          renderUnitSelect(st);
          let needVideo = false;
          if (st.control_operating_unit !== videoUnitA) {
            videoUnitA = st.control_operating_unit;
            needVideo = true;
          }
          const nextServer = st.webrtc_server || "";
          if (nextServer !== webrtcServer) {
            webrtcServer = nextServer;
            needVideo = true;
          }
          if (needVideo) renderVideo();
          showNotification(st.notification);

          const unitIps = st.unit_ips || {};
          const newIp = unitIps[st.control_operating_unit] || "";
          if (newIp !== joyCurrentIp) {
            joyCurrentIp = newIp;
            connectJoy(newIp);
          }

          const req = st.control_request || {};
          if (req.pending && req.unit >= 1 && req.unit <= 5) {
            pendingRequestUnit = req.unit;
            controlRequestText.textContent = "操縦要請　" + req.unit + "号機";
            controlRequestBar.classList.add("is-visible");
          } else {
            pendingRequestUnit = 0;
            controlRequestBar.classList.remove("is-visible");
          }
        },
      });

      function selectOperatingUnit(unit) {
        if (pendingRequestUnit === unit) {
          client.send({ type: "accept_control_request" });
          return;
        }
        client.send({ type: "set_control_operating", unit: unit });
        client.send({ type: "set_control_video", unit: unit });
      }

      document.addEventListener("keydown", function (e) {
        if (e.target.matches("input, textarea")) return;

        if (e.key >= "1" && e.key <= "5") {
          e.preventDefault();
          selectOperatingUnit(parseInt(e.key, 10));
          return;
        }
        if (e.key === "7") {
          e.preventDefault();
          setViewMode("a");
          return;
        }
        if (e.key === "8") {
          e.preventDefault();
          setViewMode("b");
          return;
        }
        if (e.key === "9") {
          e.preventDefault();
          setViewMode("both");
          return;
        }

        if (e.key !== "Enter") return;
        if (e.target.matches("button")) return;
        if (!pendingRequestUnit) return;
        e.preventDefault();
        client.send({ type: "accept_control_request" });
      });

      // ---- 再起動 / シャットダウン（操作中の号機へ POST・確認ダイアログ付き）----
      const unitRebootBtn = document.getElementById("unitReboot");
      const unitShutdownBtn = document.getElementById("unitShutdown");

      function powerAction(kind) {
        const unit = currentOperatingUnit;
        const label = kind === "shutdown" ? "シャットダウン" : "再起動";
        if (!window.confirm(unit + "号機を" + label + "します。よろしいですか？")) return;
        const path = kind === "shutdown" ? "/api/unit/shutdown" : "/api/unit/reboot";
        fetch(path, { method: "POST" })
          .then(function (res) {
            return res.json().then(function (body) { return { ok: res.ok, body: body }; });
          })
          .then(function (r) {
            const msg = (r.body && r.body.message) || "";
            if (r.ok) {
              showNotification({ text: unit + "号機 " + label + "要求を送信しました" + (msg ? "（" + msg + "）" : ""), active: true, timestamp: Date.now() / 1000 });
            } else {
              window.alert(unit + "号機の" + label + "に失敗しました。\n" + msg);
            }
          })
          .catch(function (err) {
            window.alert(unit + "号機の" + label + "要求を送信できませんでした。\n" + err);
          });
      }

      unitRebootBtn.addEventListener("click", function () { powerAction("reboot"); });
      unitShutdownBtn.addEventListener("click", function () { powerAction("shutdown"); });
    })();
  </script>
  <script src="/voice/voice-client.js"></script>
  <script>VoiceComm.init({ role: "操縦" });</script>
</body>
