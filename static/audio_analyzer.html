<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>音声解析ツール — ダミヤン</title>
  <style>
    :root {
      --bg: #1e1e22;
      --panel: #2a2a2e;
      --border: #ffffff;
      --text: #ffffff;
      --muted: #b8b8bc;
      --accent: #5bc8e8;
      --ok: #6fcf6f;
      --warn: #e8943a;
      --font: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }
    .tool {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      gap: 8px;
    }
    .tool__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .tool__title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .tool__title span { color: var(--accent); }
    .status-pill {
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 8px;
      border: 1px solid var(--warn);
      color: var(--warn);
      border-radius: 9px;
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .spectrum {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 6px;
      border: 1px solid var(--border);
      background: #141417;
    }
    .spectrum__bar {
      flex: 1;
      background: linear-gradient(to top, var(--accent), #2f6e88);
      height: 10%;
      transition: height 0.12s linear;
    }
    .readouts {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      font-size: 0.7rem;
    }
    .readout {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #3a3a40;
      padding: 1px 0;
    }
    .readout__label { color: var(--muted); }
    .readout__value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .readout__value.ok { color: var(--ok); }
    .log {
      flex-shrink: 0;
      height: 46px;
      overflow: hidden;
      font-size: 0.62rem;
      line-height: 1.5;
      color: var(--muted);
      border-top: 1px solid #3a3a40;
      padding-top: 3px;
    }
    .log p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="tool">
    <div class="tool__head">
      <div class="tool__title">音声解析ツール — <span>ダミヤン</span></div>
      <div class="status-pill">解析中</div>
    </div>
    <div class="spectrum" id="spectrum"></div>
    <div class="readouts">
      <div class="readout"><span class="readout__label">検出周波数</span><span class="readout__value" id="freq">— Hz</span></div>
      <div class="readout"><span class="readout__label">信号強度</span><span class="readout__value" id="level">— dB</span></div>
      <div class="readout"><span class="readout__label">推定パターン</span><span class="readout__value" id="pattern">○×○○×</span></div>
      <div class="readout"><span class="readout__label">一致度</span><span class="readout__value ok" id="match">— %</span></div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <script>
    (function () {
      const BAR_COUNT = 28;
      const spectrum = document.getElementById("spectrum");
      const bars = [];
      for (let i = 0; i < BAR_COUNT; i++) {
        const b = document.createElement("div");
        b.className = "spectrum__bar";
        spectrum.appendChild(b);
        bars.push(b);
      }

      const freqEl = document.getElementById("freq");
      const levelEl = document.getElementById("level");
      const patternEl = document.getElementById("pattern");
      const matchEl = document.getElementById("match");
      const logEl = document.getElementById("log");

      const PATTERNS = ["○×○○×〇×", "×○×○×○×", "○○×○×○○", "×○○×○×○"];
      let phase = 0;

      function tick() {
        phase += 0.35;
        for (let i = 0; i < BAR_COUNT; i++) {
          const base = Math.sin(phase + i * 0.5) * 0.5 + 0.5;
          const noise = Math.random() * 0.4;
          const h = Math.min(100, Math.max(6, (base * 0.7 + noise) * 100));
          bars[i].style.height = h.toFixed(0) + "%";
        }
        const peak = 420 + Math.round(Math.abs(Math.sin(phase * 0.6)) * 220);
        freqEl.textContent = peak + " Hz";
        levelEl.textContent = "-" + (8 + Math.round(Math.random() * 22)) + " dB";
        matchEl.textContent = (88 + Math.round(Math.random() * 11)) + " %";
      }

      function rotatePattern() {
        patternEl.textContent = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
      }

      function log(msg) {
        const p = document.createElement("p");
        const t = new Date().toLocaleTimeString("ja-JP");
        p.textContent = t + "  " + msg;
        logEl.insertBefore(p, logEl.firstChild);
        while (logEl.childNodes.length > 4) logEl.removeChild(logEl.lastChild);
      }

      const MSGS = [
        "サンプリング 16kHz / mono",
        "FFT 1024pt 実行",
        "ピーク検出 … 候補2件",
        "ダミヤン信号 同定",
        "パターン照合 中",
        "ノイズフロア 更新",
      ];

      setInterval(tick, 120);
      setInterval(rotatePattern, 2600);
      setInterval(function () {
        log(MSGS[Math.floor(Math.random() * MSGS.length)]);
      }, 1800);
      log("解析セッション開始");
    })();
  </script>
</body>
</html>
