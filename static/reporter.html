<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a2a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="報告者" />
  <title>報告者モード</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --orange: #d97a1f;
      --reported: #2f8f46;
      --updated: #e8943a;
    }

    .app { height: 100dvh; display: flex; flex-direction: column; }

    .rp-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.4rem + var(--safe-top)) 0.75rem 0.4rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .rp-header__title { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }

    .rp-hint {
      flex-shrink: 0;
      padding: 0.3rem 0.75rem;
      font-size: 0.66rem;
      color: var(--muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .rooms {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 0.55rem calc(0.6rem + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .room {
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    /* ルームタイトル背景：未完=オレンジ / 完了=緑（その部屋の報告が揃うと緑） */
    .room__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.6rem;
      background: var(--orange);
      color: #ffffff;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .room--done .room__head { background: var(--reported); }
    /* ルームタイトルは 2 行表示：1 行目=ルーム名 / 2 行目=場所名（A=広場, B=暗室, C=2階） */
    .room__title { display: flex; flex-direction: column; align-items: flex-start; gap: 0.05rem; }
    .room__name { font-size: 1.05rem; font-weight: 700; line-height: 1.15; }
    .room__sub { font-size: 0.66rem; color: rgba(255, 255, 255, 0.82); line-height: 1.15; }
    .room__items { display: flex; flex-direction: column; }

    /* ストーブ行と QR・顔色行の間の区切り線（<hr> 相当） */
    .room__divider { border-top: 2px solid rgba(255, 255, 255, 0.35); }
    .room__divider + .item-row { border-top: none; }

    /* 各報告項目行：タップでトグル（報告済み＝緑背景 / 報告後にデータ更新＝橙背景） */
    .item-row {
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .item-row:first-child { border-top: none; }

    .item-row__track {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.6rem;
      background: var(--surface);
      transition: background 0.15s;
    }
    .item-row.is-reported .item-row__track { background: var(--reported); }
    .item-row.is-updated .item-row__track { background: var(--updated); }

    .item-row__label {
      flex-shrink: 0;
      width: 5.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }
    .item-row.is-reported .item-row__label,
    .item-row.is-updated .item-row__label { color: rgba(255, 255, 255, 0.85); }

    .item-row__value {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15rem 0.9rem;
      font-size: 1rem;
      font-weight: 700;
    }
    .item-row.is-reported .item-row__value,
    .item-row.is-updated .item-row__value { color: #ffffff; }
    .item-row__value .muted { color: var(--muted); font-weight: 600; }
    .item-row.is-reported .item-row__value .muted,
    .item-row.is-updated .item-row__value .muted { color: rgba(255, 255, 255, 0.75); }

    .pair { display: inline-flex; align-items: center; gap: 0.35rem; min-width: 0; }
    .pair__k {
      flex-shrink: 0;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 7px;
    }
    .item-row.is-reported .pair__k,
    .item-row.is-updated .pair__k { color: #ffffff; background: rgba(0, 0, 0, 0.22); }
    .pair__v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 鳴動パターンの小型 12 マス表示（左 3 マスは灰色＝選択不可を踏襲）。
       マスは固定 px にせずコンテナ幅に追従して縮小し、12 マス 1 行を常に維持
       （狭いカラム幅ではみ出さない）。 */
    .pair--pattern {
      flex: 1 1 100%;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .pgrid {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 200px;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 2px;
      align-items: center;
    }
    .pgrid__c {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      background: var(--bg);
      min-width: 0;
    }
    .pgrid__c.is-on { background: #2fa8d8; border-color: #2fa8d8; }
    .pgrid__c.is-fixed { background: #4a4e54; border-color: #4a4e54; opacity: 0.55; }
    .item-row.is-reported .pgrid__c,
    .item-row.is-updated .pgrid__c { border-color: rgba(255, 255, 255, 0.5); }

    .cdot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      margin-right: 5px;
      vertical-align: -1px;
    }

    .chip {
      flex-shrink: 0;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 9px;
      white-space: nowrap;
    }
    .chip--pending { color: var(--muted); border: 1px solid var(--muted); }
    .chip--reported { color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.7); }
    .chip--updated {
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.7);
      animation: chipBlink 1.1s ease-in-out infinite;
    }
    @keyframes chipBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .send-bar {
      flex-shrink: 0;
      padding: 0.45rem 0.6rem calc(0.5rem + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      background: var(--surface);
    }
    .send-bar input {
      flex: 1;
      min-width: 0;
      padding: 0.55rem;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .send-bar .btn { width: auto; flex-shrink: 0; padding: 0.55rem 0.9rem; }

    /* ---- iPad レイアウト（横 1180×820 / 縦 810×1080 を主対象）----
       700px 以上で 3 ルームを横並びグリッドにして画面全体を使う。
       文字・タップ領域も拡大。700px 未満（スマホ）は従来の縦積みのまま。 */
    @media (min-width: 700px) {
      .rp-header {
        padding: calc(0.6rem + var(--safe-top)) 1.1rem 0.6rem;
      }
      .rp-header__title { font-size: 1.3rem; }
      .rp-hint { font-size: 0.85rem; padding: 0.45rem 1rem; }

      .rooms {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
        gap: 0.8rem;
        padding: 0.8rem 0.8rem calc(0.8rem + var(--safe-bottom));
      }
      .room { height: 100%; }

      .room__head {
        flex-wrap: wrap;
        gap: 0.3rem 0.6rem;
        padding: 0.85rem 0.95rem;
      }
      .room__name { font-size: 1.5rem; }
      .room__sub { font-size: 0.85rem; }

      /* 項目行は 2 段構成（ラベル行＋値/チップ行）にして行の高さ＝タップ領域を拡大 */
      .item-row__track {
        flex-wrap: wrap;
        gap: 0.4rem 0.7rem;
        padding: 0.95rem 0.95rem;
      }
      .item-row__label { width: 100%; font-size: 0.85rem; }
      .item-row__value { font-size: 1.3rem; gap: 0.25rem 1.1rem; }
      .pair__k { font-size: 0.78rem; padding: 2px 9px; border-radius: 9px; }
      .cdot { width: 15px; height: 15px; margin-right: 7px; }
      /* iPad ではマス最大 16px 相当まで拡大可（幅が足りなければ自動縮小） */
      .pgrid { max-width: 240px; }
      .chip { font-size: 0.82rem; padding: 4px 13px; border-radius: 12px; }

      .send-bar {
        padding: 0.6rem 0.9rem calc(0.65rem + var(--safe-bottom));
        gap: 8px;
      }
      .send-bar input { font-size: 1.05rem; padding: 0.8rem; }
      .send-bar .btn { font-size: 1.05rem; padding: 0.8rem 1.5rem; }
    }

    /* iPad 縦持ち等の中間幅（700〜980px）では列がやや狭いので値の文字を一段控えめに */
    @media (min-width: 700px) and (max-width: 980px) {
      .item-row__value { font-size: 1.15rem; }
      .room__name { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="rp-header">
      <h1 class="rp-header__title">報告者モード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <p class="rp-hint">各項目をタップで「報告済み（緑）」・再タップで解除。全項目が揃うとルームタイトルが緑に。</p>
    <main class="rooms" id="roomsRoot" aria-label="ルーム別 報告状況"></main>
    <div class="send-bar">
      <input id="notifyInput" type="text" placeholder="コントロールへ通知送信…" />
      <button type="button" class="btn" id="btnNotify">送信</button>
    </div>
  </div>
  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;
      const ROOMS = ["A", "B", "C"];
      const ROOM_NAMES = RC.ROOM_NAMES;
      // 報告項目行：1段目=ストーブ有無、（区切り線）、2段目=QR・顔色、
      // 3段目=鳴動パターン・周波数（解析側の結果確定後のみ値を表示）。
      // 備考はデータがある時のみ表示。
      const ITEMS = [
        { key: "stove", label: "ストーブ有無" },
        { key: "qrcolor", label: "QR / 顔色" },
        { key: "pattern", label: "鳴動・周波数" },
        { key: "notes", label: "備考" },
      ];
      const ITEM_KEYS = ITEMS.map(function (i) { return i.key; });
      const COLOR_HEX = {
        "不明": "#888888", "黒": "#111111", "赤": "#e85d5d", "緑": "#4caf50",
        "青": "#3b6fd4", "黄": "#e8c63a", "紫": "#9b59d0", "水": "#5bc8e8", "白": "#f5f5f5",
      };

      const connBadge = document.getElementById("connBadge");
      const roomsRoot = document.getElementById("roomsRoot");
      const notifyInput = document.getElementById("notifyInput");

      function esc(s) { return RC.escapeHtml(s); }

      let roomAnalysis = { A: emptyA(), B: emptyA(), C: emptyA() };
      function emptyA() {
        return {
          stove: "", stoveDone: false, qr: "", injuryDone: false,
          color: "", colorDone: false, notes: "",
          pattern: "", freq: "", patternDone: false,
        };
      }

      /* 報告状態（この端末ローカル）: reportState[room][key] = {reported, updated, sig} */
      const reportState = {};
      ROOMS.forEach(function (r) {
        reportState[r] = {};
        ITEM_KEYS.forEach(function (k) { reportState[r][k] = { reported: false, updated: false, sig: null }; });
      });

      function sigOf(a, key) {
        if (!a) return "";
        if (key === "stove") {
          return (a.stove || "") + "|" + (a.stoveDone ? "1" : "0");
        }
        if (key === "qrcolor") {
          return (a.qr || "") + "|" + (a.injuryDone ? "1" : "0") +
                 "||" + (a.color || "") + "|" + (a.colorDone ? "1" : "0");
        }
        if (key === "pattern") {
          return (a.pattern || "") + "|" + (a.freq || "") + "|" + (a.patternDone ? "1" : "0");
        }
        if (key === "notes") return a.notes || "";
        return "";
      }

      function pairHtml(k, valHtml) {
        return '<span class="pair"><span class="pair__k">' + k + '</span><span class="pair__v">' + valHtml + '</span></span>';
      }
      function itemValueHtml(a, key) {
        if (key === "stove") {
          // ストーブ有無は解析側の「結果確定」（stoveDone）後の値のみ表示する。
          // 未確定の選択途中の値は報告対象にしない（確定されると WS 配信で反映され、
          // 報告済みの行は sigOf の変化検知により「更新」バッジ＋未報告へ戻る）。
          return a.stoveDone
            ? (a.stove ? esc(a.stove) : '<span class="muted">—</span>')
            : '<span class="muted">未確定</span>';
        }
        if (key === "qrcolor") {
          const qr = a.qr ? esc(a.qr) : '<span class="muted">読み取り中</span>';
          let color = '<span class="muted">—</span>';
          if (a.color) {
            const hex = COLOR_HEX[a.color] || "#888888";
            color = '<span class="cdot" style="background:' + hex + '"></span>' + esc(a.color);
          }
          return pairHtml("QR", qr) + pairHtml("顔色", color);
        }
        if (key === "pattern") {
          // 鳴動パターン・周波数はストーブと同様、解析側の「結果確定」
          // （patternDone）後のみ値を表示する。
          if (!a.patternDone) return '<span class="muted">未確定</span>';
          let pat = String(a.pattern || "").replace(/[^01]/g, "0").slice(0, 12);
          while (pat.length < 12) pat += "0";
          const grid = '<span class="pgrid">' + pat.split("").map(function (c, i) {
            return '<span class="pgrid__c' +
              (i < 3 ? " is-fixed" : c === "1" ? " is-on" : "") + '"></span>';
          }).join("") + "</span>";
          const freq = a.freq
            ? esc(a.freq) + " Hz"
            : '<span class="muted">—</span>';
          // パターンは pair__v（ellipsis・nowrap）を使わず幅追従の専用ペアで表示
          return (
            '<span class="pair pair--pattern"><span class="pair__k">パターン</span>' +
            grid + "</span>" + pairHtml("周波数", freq)
          );
        }
        if (key === "notes") return a.notes ? esc(a.notes) : '<span class="muted">—</span>';
        return '<span class="muted">—</span>';
      }

      function chipHtml(rs) {
        if (rs.updated) return '<span class="chip chip--updated">更新</span>';
        if (rs.reported) return '<span class="chip chip--reported">報告済み</span>';
        return '<span class="chip chip--pending">未報告</span>';
      }

      function visibleKeys(r) {
        const a = roomAnalysis[r] || emptyA();
        // 備考はデータが無ければ非表示。表示中の項目が報告対象。
        return ITEM_KEYS.filter(function (k) { return !(k === "notes" && !a.notes); });
      }
      function roomAllReported(r) {
        const keys = visibleKeys(r);
        return keys.length > 0 && keys.every(function (k) { return reportState[r][k].reported; });
      }

      function roomSectionHtml(r) {
        const a = roomAnalysis[r] || emptyA();
        const rows = visibleKeys(r).map(function (k) {
          // ストーブ行と QR・顔色行の間に区切り線（<hr> 相当）を入れる
          const divider = k === "qrcolor" ? '<div class="room__divider"></div>' : "";
          const item = ITEMS.filter(function (it) { return it.key === k; })[0];
          const rs = reportState[r][k];
          const cls = "item-row" + (rs.reported ? " is-reported" : "") + (rs.updated ? " is-updated" : "");
          return (
            divider +
            '<div class="' + cls + '" data-room="' + r + '" data-key="' + k + '">' +
            '<div class="item-row__track">' +
            '<span class="item-row__label">' + item.label + '</span>' +
            '<span class="item-row__value">' + itemValueHtml(a, k) + '</span>' +
            chipHtml(rs) +
            '</div></div>'
          );
        }).join("");
        const done = roomAllReported(r);
        return (
          '<section class="room' + (done ? " room--done" : "") + '" data-room-section="' + r + '">' +
          '<div class="room__head"><div class="room__title">' +
          '<span class="room__name">ルーム' + r + '</span>' +
          '<span class="room__sub">' + ROOM_NAMES[r] + '</span></div>' +
          "</div>" +
          '<div class="room__items">' + rows + "</div></section>"
        );
      }

      function renderAll() {
        roomsRoot.innerHTML = ROOMS.map(roomSectionHtml).join("");
      }
      function renderRoom(r) {
        const sec = roomsRoot.querySelector('[data-room-section="' + r + '"]');
        if (sec) sec.outerHTML = roomSectionHtml(r);
      }

      function toggleReported(r, k) {
        const wasDone = roomAllReported(r);
        const rs = reportState[r][k];
        rs.reported = !rs.reported;
        if (rs.reported) {
          rs.updated = false;
          rs.sig = sigOf(roomAnalysis[r], k);
        }
        renderRoom(r);
        const nowDone = roomAllReported(r);
        if (!wasDone && nowDone) {
          client.send({ type: "notify", text: "ルーム" + r + "（" + ROOM_NAMES[r] + "）報告完了" });
        }
      }

      /* ---- サーバー状態反映：報告済み項目が更新されたら未報告＋更新バッジ ---- */
      function applyState(st) {
        if (st.room_analysis) roomAnalysis = st.room_analysis;
        ROOMS.forEach(function (r) {
          const a = roomAnalysis[r] || emptyA();
          ITEM_KEYS.forEach(function (k) {
            const rs = reportState[r][k];
            const sig = sigOf(a, k);
            if (rs.sig === null) {
              rs.sig = sig;
            } else if (sig !== rs.sig) {
              rs.sig = sig;
              if (rs.reported) {
                rs.reported = false;
                rs.updated = true;
              }
            }
          });
        });
        renderAll();
      }

      const client = RC.createWsClient("reporter", {
        onStatus: function (s) { RC.setConnBadge(connBadge, s); },
        onState: applyState,
      });

      /* ---- タップで報告状態をトグル ---- */
      roomsRoot.addEventListener("click", function (e) {
        const row = e.target.closest(".item-row");
        if (!row) return;
        toggleReported(row.dataset.room, row.dataset.key);
      });

      /* ---- コントロールへの手動通知 ---- */
      document.getElementById("btnNotify").addEventListener("click", function () {
        const text = notifyInput.value.trim();
        if (!text) return;
        client.send({ type: "notify", text: text });
        notifyInput.value = "";
      });
      notifyInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("btnNotify").click();
      });

      renderAll();
    })();
  </script>
</body>
</html>
