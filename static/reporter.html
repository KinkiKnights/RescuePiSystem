<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a2a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="報告者" />
  <title>報告者モード</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --orange: #d97a1f;
      --reported: #2f8f46;
      --updated: #e8943a;
    }

    .app { height: 100dvh; display: flex; flex-direction: column; }

    .rp-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.4rem + var(--safe-top)) 0.75rem 0.4rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .rp-header__title { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }

    .rp-hint {
      flex-shrink: 0;
      padding: 0.3rem 0.75rem;
      font-size: 0.66rem;
      color: var(--muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .rooms {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 0.55rem calc(0.6rem + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .room {
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    .room__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.6rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .room__title { display: flex; align-items: baseline; gap: 0.4rem; }
    .room__name { font-size: 1.05rem; font-weight: 700; }
    .room__sub { font-size: 0.66rem; color: var(--muted); }
    .room__unit {
      font-size: 0.66rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--orange);
      padding: 1px 8px;
      border-radius: 9px;
    }
    .room__unit--none { background: #6a6a72; }

    .room__items { display: flex; flex-direction: column; }

    .item-row {
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 3px solid transparent;
    }
    .item-row:first-child { border-top: none; }
    .item-row.is-reported { border-left-color: var(--reported); }
    .item-row.is-updated { border-left-color: var(--updated); }

    .item-row__hint {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0 0.85rem;
      pointer-events: none;
    }
    .item-row__hint--report { left: 0; color: var(--reported); }
    .item-row__hint--clear { right: 0; color: var(--updated); }

    .item-row__track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.6rem;
      background: var(--surface);
      will-change: transform;
    }
    .item-row__label {
      flex-shrink: 0;
      width: 5.2rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }
    .item-row__value {
      flex: 1;
      min-width: 0;
      font-size: 1rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-row.is-reported .item-row__value { opacity: 0.55; }
    .item-row__value .muted { color: var(--muted); font-weight: 600; }
    .cdot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      margin-right: 5px;
      vertical-align: -1px;
    }

    .chip {
      flex-shrink: 0;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 9px;
      white-space: nowrap;
    }
    .chip--pending { color: var(--muted); border: 1px solid var(--muted); }
    .chip--reported { color: #ffffff; background: var(--reported); border: 1px solid var(--reported); }
    .chip--updated {
      color: #ffffff;
      background: var(--updated);
      border: 1px solid var(--updated);
      animation: chipBlink 1.1s ease-in-out infinite;
    }
    @keyframes chipBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .room__foot { padding: 0.45rem 0.6rem; border-top: 1px solid var(--border); }
    .room__report-btn {
      width: 100%;
      padding: 0.55rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--orange);
      border: 1px solid var(--orange);
      cursor: pointer;
    }
    .room__report-btn.is-done { background: var(--reported); border-color: var(--reported); }

    .send-bar {
      flex-shrink: 0;
      padding: 0.45rem 0.6rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      background: var(--surface);
    }
    .send-bar input {
      flex: 1;
      min-width: 0;
      padding: 0.55rem;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .send-bar .btn { width: auto; flex-shrink: 0; padding: 0.55rem 0.9rem; }

    .ptt-bar {
      flex-shrink: 0;
      padding: 0.5rem 0.6rem calc(0.6rem + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .ptt-btn {
      width: 100%;
      padding: 0.95rem;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: #2f8f46;
      border: 1px solid #2f8f46;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .ptt-btn__dot { width: 11px; height: 11px; border-radius: 50%; background: #ffffff; flex-shrink: 0; }
    .ptt-btn.is-talking {
      background: #c46a1a;
      border-color: #c46a1a;
      animation: pttPulse 0.8s ease-in-out infinite;
    }
    @keyframes pttPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="rp-header">
      <h1 class="rp-header__title">報告者モード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <p class="rp-hint">各項目を右スワイプで「報告済み」・左スワイプで解除</p>
    <main class="rooms" id="roomsRoot" aria-label="ルーム別 報告状況"></main>
    <div class="send-bar">
      <input id="notifyInput" type="text" placeholder="コントロールへ通知送信…" />
      <button type="button" class="btn" id="btnNotify">送信</button>
    </div>
    <div class="ptt-bar">
      <button type="button" class="ptt-btn" id="pttBtn">
        <span class="ptt-btn__dot"></span><span id="pttLabel">押している間 送話</span>
      </button>
    </div>
  </div>
  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;
      const ROOMS = ["A", "B", "C"];
      const KEYS = ["stove", "injury", "color", "notes"];
      const SWIPE_THRESHOLD = 72;
      const ROOM_NAMES = RC.ROOM_NAMES;
      const LABELS = { stove: "ストーブ", injury: "負傷（QR）", color: "顔色", notes: "備考" };
      const COLOR_HEX = {
        "不明": "#888888", "黒": "#111111", "赤": "#e85d5d", "緑": "#4caf50",
        "青": "#3b6fd4", "黄": "#e8c63a", "紫": "#9b59d0", "水": "#5bc8e8", "白": "#f5f5f5",
      };

      const connBadge = document.getElementById("connBadge");
      const roomsRoot = document.getElementById("roomsRoot");
      const notifyInput = document.getElementById("notifyInput");

      function esc(s) { return RC.escapeHtml(s); }

      let roomUnits = { A: 0, B: 0, C: 0 };
      let roomAnalysis = {
        A: emptyA(), B: emptyA(), C: emptyA(),
      };
      function emptyA() {
        return { stove: "", stoveDone: false, qr: "", injuryDone: false, color: "", colorDone: false, notes: "" };
      }

      /* 報告状態（この端末ローカル）: reportState[room][key] = {reported, updated, sig} */
      const reportState = {};
      ROOMS.forEach(function (r) {
        reportState[r] = {};
        KEYS.forEach(function (k) { reportState[r][k] = { reported: false, updated: false, sig: null }; });
      });

      function sigOf(a, key) {
        if (!a) return "";
        if (key === "stove") return (a.stove || "") + "|" + (a.stoveDone ? "1" : "0");
        if (key === "injury") return (a.qr || "") + "|" + (a.injuryDone ? "1" : "0");
        if (key === "color") return (a.color || "") + "|" + (a.colorDone ? "1" : "0");
        if (key === "notes") return a.notes || "";
        return "";
      }

      function itemValueHtml(a, key) {
        if (key === "stove") return a.stove ? esc(a.stove) : "—";
        if (key === "injury") return a.qr ? esc(a.qr) : '<span class="muted">読み取り中</span>';
        if (key === "color") {
          if (!a.color) return "—";
          const hex = COLOR_HEX[a.color] || "#888888";
          return '<span class="cdot" style="background:' + hex + '"></span>' + esc(a.color);
        }
        if (key === "notes") return a.notes ? esc(a.notes) : "—";
        return "—";
      }

      function chipHtml(rs) {
        if (rs.updated) return '<span class="chip chip--updated">更新</span>';
        if (rs.reported) return '<span class="chip chip--reported">報告済み</span>';
        return '<span class="chip chip--pending">未報告</span>';
      }

      function reportableKeys(r) {
        const a = roomAnalysis[r] || emptyA();
        return KEYS.filter(function (k) { return !(k === "notes" && !a.notes); });
      }
      function roomAllReported(r) {
        const keys = reportableKeys(r);
        return keys.length > 0 && keys.every(function (k) { return reportState[r][k].reported; });
      }

      function roomSectionHtml(r) {
        const a = roomAnalysis[r] || emptyA();
        const unit = roomUnits[r];
        const unitBadge = unit
          ? '<span class="room__unit">' + unit + '号機対応中</span>'
          : '<span class="room__unit room__unit--none">未割当</span>';
        const rows = KEYS.map(function (k) {
          if (k === "notes" && !a.notes) return "";
          const rs = reportState[r][k];
          const cls = "item-row" + (rs.reported ? " is-reported" : "") + (rs.updated ? " is-updated" : "");
          return (
            '<div class="' + cls + '" data-room="' + r + '" data-key="' + k + '">' +
            '<span class="item-row__hint item-row__hint--report">報告</span>' +
            '<span class="item-row__hint item-row__hint--clear">解除</span>' +
            '<div class="item-row__track">' +
            '<span class="item-row__label">' + LABELS[k] + '</span>' +
            '<span class="item-row__value">' + itemValueHtml(a, k) + '</span>' +
            chipHtml(rs) +
            '</div></div>'
          );
        }).join("");
        const all = roomAllReported(r);
        const btn =
          '<button type="button" class="room__report-btn' + (all ? " is-done" : "") + '" data-room="' + r + '">' +
          (all ? "報告済み：撤回する" : "報告完了") +
          "</button>";
        return (
          '<section class="room" data-room-section="' + r + '">' +
          '<div class="room__head"><div class="room__title">' +
          '<span class="room__name">ルーム' + r + '</span>' +
          '<span class="room__sub">' + ROOM_NAMES[r] + '</span></div>' +
          unitBadge + "</div>" +
          '<div class="room__items">' + rows + "</div>" +
          '<div class="room__foot">' + btn + "</div></section>"
        );
      }

      function renderAll() {
        roomsRoot.innerHTML = ROOMS.map(roomSectionHtml).join("");
      }
      function renderRoom(r) {
        const sec = roomsRoot.querySelector('[data-room-section="' + r + '"]');
        if (sec) sec.outerHTML = roomSectionHtml(r);
      }

      function setReported(r, k, val) {
        const rs = reportState[r][k];
        rs.reported = val;
        if (val) {
          rs.updated = false;
          rs.sig = sigOf(roomAnalysis[r], k);
        }
        renderRoom(r);
      }

      /* ---- サーバー状態反映：報告済み項目が更新されたら未報告＋更新バッジ ---- */
      function applyState(st) {
        if (st.room_units) roomUnits = st.room_units;
        if (st.room_analysis) roomAnalysis = st.room_analysis;
        ROOMS.forEach(function (r) {
          const a = roomAnalysis[r] || emptyA();
          KEYS.forEach(function (k) {
            const rs = reportState[r][k];
            const sig = sigOf(a, k);
            if (rs.sig === null) {
              rs.sig = sig;
            } else if (sig !== rs.sig) {
              rs.sig = sig;
              if (rs.reported) {
                rs.reported = false;
                rs.updated = true;
              }
            }
          });
        });
        renderAll();
      }

      const client = RC.createWsClient("reporter", {
        onStatus: function (s) { RC.setConnBadge(connBadge, s); },
        onState: applyState,
      });

      /* ---- 報告完了ボタン（ルーム一括）---- */
      roomsRoot.addEventListener("click", function (e) {
        const btn = e.target.closest(".room__report-btn");
        if (!btn) return;
        const r = btn.dataset.room;
        const all = roomAllReported(r);
        reportableKeys(r).forEach(function (k) {
          const rs = reportState[r][k];
          rs.reported = !all;
          if (!all) {
            rs.updated = false;
            rs.sig = sigOf(roomAnalysis[r], k);
          }
        });
        renderRoom(r);
        if (!all) {
          client.send({ type: "notify", text: "ルーム" + r + "（" + ROOM_NAMES[r] + "）報告完了" });
        }
      });

      /* ---- スワイプで項目の報告状態を切替（右=報告 / 左=解除）---- */
      let drag = null;
      roomsRoot.addEventListener("pointerdown", function (e) {
        const item = e.target.closest(".item-row");
        if (!item) return;
        const track = item.querySelector(".item-row__track");
        drag = {
          item: item, track: track,
          room: item.dataset.room, key: item.dataset.key,
          startX: e.clientX, startY: e.clientY,
          locked: false, pointerId: e.pointerId,
        };
        track.style.transition = "none";
        try { item.setPointerCapture(e.pointerId); } catch (_) {}
      }, { passive: true });

      roomsRoot.addEventListener("pointermove", function (e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        if (!drag.locked) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          drag.locked = Math.abs(dx) > Math.abs(dy);
          if (!drag.locked) { drag = null; return; }
        }
        e.preventDefault();
        drag.track.style.transform = "translateX(" + dx + "px)";
      }, { passive: false });

      function endDrag(e) {
        if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.pointerId)) return;
        const dx = (e.clientX !== undefined ? e.clientX : drag.startX) - drag.startX;
        const room = drag.room, key = drag.key;
        drag.track.style.transition = "transform 0.18s ease-out";
        drag.track.style.transform = "";
        const d = drag;
        drag = null;
        if (Math.abs(dx) >= SWIPE_THRESHOLD) {
          setReported(room, key, dx > 0);
        }
      }
      roomsRoot.addEventListener("pointerup", endDrag);
      roomsRoot.addEventListener("pointercancel", endDrag);

      /* ---- コントロールへの手動通知 ---- */
      document.getElementById("btnNotify").addEventListener("click", function () {
        const text = notifyInput.value.trim();
        if (!text) return;
        client.send({ type: "notify", text: text });
        notifyInput.value = "";
      });
      notifyInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("btnNotify").click();
      });

      renderAll();
    })();
  </script>
  <script src="/voice/voice-client.js"></script>
  <script>VoiceComm.init({ role: "報告者" });</script>
  <script>
    (function () {
      var btn = document.getElementById("pttBtn");
      var label = document.getElementById("pttLabel");
      if (!btn) return;
      var active = false;
      function start(e) {
        if (e) e.preventDefault();
        if (active) return;
        active = true;
        btn.classList.add("is-talking");
        label.textContent = "送話中…";
        if (window.VoiceComm) window.VoiceComm.startTalk();
      }
      function stop() {
        if (!active) return;
        active = false;
        btn.classList.remove("is-talking");
        label.textContent = "押している間 送話";
        if (window.VoiceComm) window.VoiceComm.stopTalk();
      }
      btn.addEventListener("pointerdown", function (e) {
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        start(e);
      });
      btn.addEventListener("pointerup", stop);
      btn.addEventListener("pointercancel", stop);
      btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      window.addEventListener("blur", stop);
    })();
  </script>
</body>
</html>
