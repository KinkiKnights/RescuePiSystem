<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>エンジニアモード</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    .engineer-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 240px 1fr 210px;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .col--left { border-right: 1px solid var(--border); }
    .col--right { border-left: 1px solid var(--border); }

    .notify-bar {
      flex-shrink: 0;
      min-height: 40px;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      transition: background 0.3s;
    }
    .notify-bar.is-active {
      background: #c46a1a;
      animation: notifyPulse 1.2s ease-in-out 3;
    }
    .notify-bar__empty { color: var(--muted); font-weight: 400; }
    @keyframes notifyPulse {
      0%, 100% { background: #c46a1a; }
      50% { background: #e8943a; }
    }

    /* ---- タスク進行状況（コントロールモードと共通） ---- */
    .task-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px;
      overflow-y: auto;
    }
    .task-group {
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .task-group__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.6rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .task-group__title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }
    .task-group__badge {
      flex-shrink: 0;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 7px;
      border: 1px solid var(--warn);
      border-radius: 9px;
      background: var(--warn);
      color: #ffffff;
      white-space: nowrap;
    }
    .task-group__count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .task-group__count.is-complete { color: var(--ok); }
    .task-group__bar {
      height: 3px;
      background: var(--surface2);
    }
    .task-group__bar i {
      display: block;
      height: 100%;
      background: var(--ok);
      transition: width 0.3s;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
    }
    .task-row:first-child { border-top: none; }
    .task-row:not(.is-done):hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .task-row.is-done { cursor: default; }
    .task-row__check {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      line-height: 1;
      color: transparent;
    }
    .task-row.is-done .task-row__check {
      background: var(--ok);
      border-color: var(--ok);
      color: #1e1e22;
    }
    .task-row.is-done { color: var(--muted); }
    .task-row.is-done .task-row__label { text-decoration: line-through; }
    .task-row.is-current {
      background: rgba(91, 155, 213, 0.16);
      border-left: 3px solid var(--accent);
      padding-left: calc(0.6rem - 3px);
    }
    .task-row.is-current .task-row__check { border-color: var(--accent); }

    /* ---- 映像 3x2 ---- */
    .video-area {
      flex: 1;
      min-height: 0;
      padding: 4px;
      display: flex;
    }
    .video-grid--3x2 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
    }
    .video-grid--3x2 .video-box video { object-fit: contain; }
    .video-grid--3x2 .video-box[data-unit] { cursor: pointer; }
    .video-grid--3x2 .video-box.is-target {
      background: #2fa8d8;
      border-color: #2fa8d8;
    }
    .video-grid--3x2 .video-box.is-target .video-box__label {
      border-color: #2fa8d8;
      background: #2fa8d8;
    }
    .video-grid--3x2 .video-box.is-disabled video { opacity: 0.25; }
    .video-box__disabled {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--danger);
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .conn-cell {
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .conn-cell__title {
      flex-shrink: 0;
      padding: 0.3rem 0.55rem;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .conn-tiles {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
    }
    .conn-group {
      border: 1px solid var(--border);
      padding: 4px;
    }
    .conn-group__title {
      margin: 0 0 4px;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .conn-group__grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .conn-tile {
      min-width: 0;
      padding: 0.3rem 0.45rem;
      border: 1px solid var(--border);
      background: #5a5a62;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .conn-tile--ok { background: #2f6e3d; }
    .conn-tile--ng { background: #9c3434; }
    .conn-tile__status {
      display: block;
      margin-top: 1px;
      font-size: 0.64rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conn-tile--unit { cursor: pointer; }
    .conn-tile--unit:hover,
    .conn-tile.is-target {
      outline: 2px solid #2fa8d8;
      outline-offset: -2px;
    }
    .conn-tile.is-operating .conn-tile__status::after {
      content: " ｜操縦中";
    }

    /* ---- 右：操作パネル ---- */
    .operating-banner {
      flex-shrink: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .operating-banner span { color: var(--accent); }
    .target-banner {
      flex-shrink: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .target-banner span { color: #2fa8d8; }
    .action-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .btn.is-locked,
    .btn.is-locked:hover {
      background: #4a4a4e;
      color: #8d8d92;
      border-color: #8d8d92;
      cursor: not-allowed;
      box-shadow: none;
    }
    .guard-hint {
      flex-shrink: 0;
      margin: 0;
      padding: 0.4rem 0.6rem;
      font-size: 0.68rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-header__title">エンジニアモード</h1>
      <span class="conn-badge connecting" id="connBadge">接続中…</span>
    </header>
    <div class="notify-bar" id="notifyBar" aria-live="polite">
      <span class="notify-bar__empty" id="notifyText">通知はありません</span>
    </div>
    <main class="app-main engineer-body">
      <aside class="col col--left panel">
        <h2 class="panel-title">タスク進行状況</h2>
        <div class="task-list" id="taskList"></div>
      </aside>

      <section class="col panel">
        <h2 class="panel-title">機体映像（1〜5号機）</h2>
        <div class="video-area">
          <div class="video-grid--3x2" id="videoGrid"></div>
        </div>
      </section>

      <aside class="col col--right panel">
        <p class="operating-banner">操縦中：<span id="operatingUnit">1</span>号機</p>
        <p class="target-banner">対象：<span id="targetUnitLabel">1</span>号機</p>
        <h2 class="panel-title">操作</h2>
        <div class="btn-row action-list" id="actionList"></div>
        <p class="guard-hint">対象号機はカメラ映像か接続情報タイルをクリックで選択（1〜5キーも可）。再起動・通信切替は <kbd>Ctrl</kbd> を押している間のみ有効。</p>
      </aside>
    </main>
  </div>

  <script src="/static/common.js"></script>
  <script>
    (function () {
      const RC = window.RescueCommon;

      const ACTIONS = [
        { action: "analysis1", label: "解析要請1" },
        { action: "analysis2", label: "解析要請2" },
        { action: "interrupt1", label: "操縦要請1" },
        { action: "interrupt2", label: "操縦要請2" },
        { action: "disable_unit", label: "行動不能" },
        { action: "set_room", room: "A", label: "ルームA（広場）" },
        { action: "set_room", room: "B", label: "ルームB(暗室)" },
        { action: "set_room", room: "C", label: "ルームC(2階)" },
        { action: "reboot_pi", label: "再起動", guard: true },
        { action: "toggle_method", label: "通信切替", guard: true },
      ];

      const SERVER_CONN = ["音声解析サーバ", "コントロールサーバ", "通話サーバ"];
      const TERMINAL_CONN = ["オペレータ1", "オペレータ2", "報告者", "解析1", "解析2"];

      let roomUnits = { A: 4, B: 3, C: 5 };
      let latestUnits = {};

      const connBadge = document.getElementById("connBadge");
      const notifyBar = document.getElementById("notifyBar");
      const notifyText = document.getElementById("notifyText");
      let lastNotifyTs = 0;

      function showNotification(n) {
        if (!n || !n.text) {
          notifyText.textContent = "通知はありません";
          notifyText.className = "notify-bar__empty";
          notifyBar.classList.remove("is-active");
          return;
        }
        notifyText.textContent = n.text;
        notifyText.className = "";
        if (n.active && n.timestamp !== lastNotifyTs) {
          lastNotifyTs = n.timestamp;
          notifyBar.classList.remove("is-active");
          void notifyBar.offsetWidth;
          notifyBar.classList.add("is-active");
          setTimeout(function () { notifyBar.classList.remove("is-active"); }, 3600);
        }
      }
      const taskList = document.getElementById("taskList");
      const videoGrid = document.getElementById("videoGrid");
      const operatingUnit = document.getElementById("operatingUnit");
      const targetUnitLabel = document.getElementById("targetUnitLabel");
      const actionList = document.getElementById("actionList");

      let selectedUnit = 1;
      let ctrlHeld = false;

      /* ---- 映像 3x2 ＋ 接続情報セルを一度だけ構築 ---- */
      videoGrid.innerHTML =
        [1, 2, 3, 4, 5].map(function (n) { return RC.videoBox(n); }).join("") +
        '<div class="conn-cell">' +
        '<div class="conn-cell__title">接続情報</div>' +
        '<div class="conn-tiles" id="connTiles"></div>' +
        "</div>";
      RC.initVideos(videoGrid);
      const connTilesEl = document.getElementById("connTiles");

      /* ---- 対象号機の選択（カメラ映像／接続タイルのクリック） ---- */
      function updateTargetHighlights() {
        targetUnitLabel.textContent = selectedUnit;
        videoGrid.querySelectorAll(".video-box[data-unit]").forEach(function (box) {
          box.classList.toggle(
            "is-target",
            parseInt(box.dataset.unit, 10) === selectedUnit
          );
        });
        connTilesEl
          .querySelectorAll(".conn-tile--unit")
          .forEach(function (tile) {
            tile.classList.toggle(
              "is-target",
              parseInt(tile.dataset.unit, 10) === selectedUnit
            );
          });
      }

      function setSelectedUnit(n) {
        selectedUnit = n;
        updateTargetHighlights();
        updateDisableButton();
      }

      videoGrid.addEventListener("click", function (e) {
        const tile = e.target.closest(".conn-tile--unit");
        if (tile) {
          setSelectedUnit(parseInt(tile.dataset.unit, 10));
          return;
        }
        const box = e.target.closest(".video-box[data-unit]");
        if (!box) return;
        const n = parseInt(box.dataset.unit, 10);
        if (n >= 1 && n <= 5) setSelectedUnit(n);
      });

      /* ---- アクションボタン（再起動・通信切替は Ctrl ガード付き） ---- */
      actionList.innerHTML = ACTIONS.map(function (a, i) {
        return (
          '<button type="button" class="btn' +
          (a.guard ? " btn--guard is-locked" : "") +
          '" data-idx="' + i + '" data-action="' + a.action + '">' +
          RC.escapeHtml(a.label) +
          "</button>"
        );
      }).join("");
      const disableBtn = actionList.querySelector('[data-action="disable_unit"]');

      function updateGuardButtons() {
        actionList.querySelectorAll(".btn--guard").forEach(function (btn) {
          btn.classList.toggle("is-locked", !ctrlHeld);
        });
      }

      function updateDisableButton() {
        if (!disableBtn) return;
        const u = latestUnits[selectedUnit] || {};
        disableBtn.textContent = u.disabled ? "復活" : "行動不能";
      }

      actionList.addEventListener("click", function (e) {
        const btn = e.target.closest(".btn");
        if (!btn) return;
        const a = ACTIONS[parseInt(btn.dataset.idx, 10)];
        if (a.guard && !(ctrlHeld || e.ctrlKey)) return;
        const payload = {
          type: "engineer_action",
          unit: selectedUnit,
          action: a.action,
        };
        if (a.room) payload.room = a.room;
        client.send(payload);
      });

      /* ---- タスク進行状況（コントロールモードと同様） ---- */
      function renderTaskRows(tasks) {
        let currentMarked = false;
        return tasks
          .map(function (t) {
            let cls = "";
            if (t.done) {
              cls = " is-done";
            } else if (!currentMarked) {
              cls = " is-current";
              currentMarked = true;
            }
            return (
              '<div class="task-row' +
              cls +
              '" data-task-id="' +
              t.id +
              '"><span class="task-row__check">✓</span>' +
              '<span class="task-row__label">' +
              RC.escapeHtml(t.text) +
              "</span></div>"
            );
          })
          .join("");
      }

      function renderTaskGroup(title, tasks, badge) {
        const done = tasks.filter(function (t) { return t.done; }).length;
        const total = tasks.length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const complete = done === total && total > 0;
        return (
          '<div class="task-group">' +
          '<div class="task-group__head"><span class="task-group__title"><span>' +
          RC.escapeHtml(title) +
          "</span>" +
          (badge
            ? '<span class="task-group__badge">' + RC.escapeHtml(badge) + "</span>"
            : "") +
          '</span><span class="task-group__count' +
          (complete ? " is-complete" : "") +
          '">' +
          done +
          "/" +
          total +
          "</span></div>" +
          '<div class="task-group__bar"><i style="width:' +
          pct +
          '%"></i></div>' +
          renderTaskRows(tasks) +
          "</div>"
        );
      }

      function renderTasks(tasks) {
        const list = tasks || [];
        const common = list.filter(function (t) { return !t.room; });
        let html = "";
        if (common.length) html += renderTaskGroup("共通", common);
        ["A", "B", "C"].forEach(function (room) {
          const group = list.filter(function (t) { return t.room === room; });
          if (group.length) {
            const badge = roomUnits[room] ? roomUnits[room] + "号機対応中" : null;
            html += renderTaskGroup("ルーム" + room, group, badge);
          }
        });
        taskList.innerHTML = html;
      }

      taskList.addEventListener("click", function (e) {
        const row = e.target.closest(".task-row");
        if (!row || row.classList.contains("is-done")) return;
        const id = parseInt(row.dataset.taskId, 10);
        if (!id) return;
        client.send({ type: "complete_task", task_id: id });
      });

      /* ---- 接続情報タイル ---- */
      function connTile(name, ok, status, options) {
        options = options || {};
        let cls = "conn-tile " + (ok ? "conn-tile--ok" : "conn-tile--ng");
        if (options.unit) cls += " conn-tile--unit";
        if (options.operating) cls += " is-operating";
        return (
          '<div class="' +
          cls +
          '"' +
          (options.unit ? ' data-unit="' + options.unit + '"' : "") +
          ">" +
          RC.escapeHtml(name) +
          '<span class="conn-tile__status">' +
          RC.escapeHtml(status) +
          "</span></div>"
        );
      }

      function connGroup(title, tilesHtml) {
        return (
          '<div class="conn-group">' +
          '<p class="conn-group__title">' +
          RC.escapeHtml(title) +
          "</p>" +
          '<div class="conn-group__grid">' +
          tilesHtml +
          "</div></div>"
        );
      }

      function renderConn(st) {
        const units = st.units || {};
        const robotTiles = [1, 2, 3, 4, 5]
          .map(function (n) {
            const u = units[n] || {};
            let status;
            if (u.disabled) {
              status = "行動不能";
            } else if (u.connected) {
              status = (u.method || "—") + " " + (u.delay_ms != null ? u.delay_ms + "ms" : "");
            } else {
              status = "切断";
            }
            return connTile(n + "号機", u.connected, status, {
              unit: n,
              operating: n === st.control_operating_unit,
            });
          })
          .join("");
        const serverTiles = SERVER_CONN.map(function (name) {
          return connTile(name, true, "接続");
        }).join("");
        const terminalTiles = TERMINAL_CONN.map(function (name) {
          return connTile(name, true, "接続");
        }).join("");
        connTilesEl.innerHTML =
          connGroup("ロボット", robotTiles) +
          connGroup("サーバ", serverTiles) +
          connGroup("操作端末", terminalTiles);
        updateTargetHighlights();
      }

      function updateCameraDisabled(units) {
        videoGrid.querySelectorAll(".video-box[data-unit]").forEach(function (box) {
          const n = parseInt(box.dataset.unit, 10);
          const u = units[n] || {};
          box.classList.toggle("is-disabled", !!u.disabled);
          let ov = box.querySelector(".video-box__disabled");
          if (u.disabled) {
            if (!ov) {
              ov = document.createElement("span");
              ov.className = "video-box__disabled";
              ov.textContent = "行動不能";
              box.appendChild(ov);
            }
          } else if (ov) {
            ov.remove();
          }
        });
      }

      /* ---- WebSocket ---- */
      const client = RC.createWsClient("engineer", {
        onStatus: function (s) {
          RC.setConnBadge(connBadge, s);
        },
        onState: function (st) {
          operatingUnit.textContent = st.control_operating_unit || 1;
          latestUnits = st.units || {};
          roomUnits = st.room_units || roomUnits;
          showNotification(st.notification);
          renderTasks(st.tasks);
          renderConn(st);
          updateCameraDisabled(latestUnits);
          updateDisableButton();
        },
      });

      /* ---- キーボード：1〜5で対象号機を選択、Ctrlでガード解除 ---- */
      document.addEventListener("keydown", function (e) {
        if (e.key === "Control") {
          ctrlHeld = true;
          updateGuardButtons();
          return;
        }
        if (e.target.matches("input, textarea, select")) return;
        if (e.key >= "1" && e.key <= "5") {
          setSelectedUnit(parseInt(e.key, 10));
        }
      });
      document.addEventListener("keyup", function (e) {
        if (e.key === "Control") {
          ctrlHeld = false;
          updateGuardButtons();
        }
      });
      window.addEventListener("blur", function () {
        ctrlHeld = false;
        updateGuardButtons();
      });

      updateTargetHighlights();

      window.addEventListener("beforeunload", function () {
        client.close();
      });
    })();
  </script>
  <script src="/voice/voice-client.js"></script>
  <script>VoiceComm.init({ role: "エンジニア" });</script>
</body>
</html>
