<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR デバッグ (unit5)</title>
<style>
  body{font-family:system-ui,sans-serif;background:#101418;color:#e8eef4;margin:0;padding:14px;line-height:1.55}
  h1{font-size:16px;margin:0 0 10px}
  video{width:100%;max-width:760px;background:#000;border-radius:8px}
  table{border-collapse:collapse;margin-top:10px;font-size:14px}
  td{padding:3px 10px;border-bottom:1px solid #2a3340}
  td:first-child{color:#8ab4f8;white-space:nowrap}
  .ok{color:#34d399;font-weight:700}.ng{color:#f87171}
  #decoded{font-size:20px;font-weight:700;color:#34d399}
</style>
</head>
<body>
<h1>QR デバッグ — 5号機(KK05) 映像を直接スキャン</h1>
<video id="v" autoplay muted playsinline></video>
<table>
  <tr><td>WebRTC</td><td id="st">connecting…</td></tr>
  <tr><td>映像サイズ</td><td id="dim">—</td></tr>
  <tr><td>スキャン回数</td><td id="scans">0</td></tr>
  <tr><td>jsQR 検出</td><td id="det" class="ng">なし</td></tr>
  <tr><td>binaryData</td><td id="bin">—</td></tr>
  <tr><td>デコード結果</td><td id="decoded">—</td></tr>
  <tr><td>読取(分:秒)</td><td id="clock">—</td></tr>
</table>
<script src="/static/jsqr.js"></script>
<script>
"use strict";
/* ---- common.js と同一のデコード ---- */
function decodeQrText(code){
  if(!code) return "";
  const bin = code.binaryData;
  if(bin && bin.length){
    const bytes = Uint8Array.from(bin);
    try { return new TextDecoder("utf-8",{fatal:true}).decode(bytes); }
    catch(e){ try { return new TextDecoder("shift-jis",{fatal:false}).decode(bytes); } catch(e2){} }
  }
  return code.data || "";
}
function mmss(ts){const d=new Date(ts);return String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}

const $ = id => document.getElementById(id);
const video = $("v");

/* ---- WebRTC 接続 (relay :8080 / viewer KK05) ---- */
let wsState="init", lastMsg="", lastErr="";
const ws = new WebSocket("ws://" + location.hostname + ":8080/ws");
const pc = new RTCPeerConnection();
pc.ontrack = e => { video.srcObject = e.streams[0] || new MediaStream([e.track]); };
pc.onicecandidate = e => { if(e.candidate) ws.send(JSON.stringify({type:"candidate",candidate:e.candidate})); };
pc.onconnectionstatechange = () => { $("st").textContent = pc.connectionState; $("st").className = pc.connectionState==="connected"?"ok":"ng"; };
ws.onopen = () => { wsState="open"; ws.send(JSON.stringify({type:"hello",role:"viewer",id:"KK05"})); };
ws.onerror = () => { wsState="error"; };
ws.onclose = e => { wsState="closed:"+e.code; };
ws.onmessage = async ev => {
  try {
    const m = JSON.parse(ev.data);
    lastMsg = m.type || "?";
    if(m.type==="offer"){
      // relay 仕様: offer は m.sdp に記述オブジェクト、answer は localDescription を丸ごと返す
      await pc.setRemoteDescription(m.sdp);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      ws.send(JSON.stringify({type:"answer",sdp:pc.localDescription}));
    } else if(m.type==="candidate" && m.candidate){
      try{ await pc.addIceCandidate(m.candidate); }catch(e){}
    } else if(m.type==="error"){
      lastErr = "relay:"+(m.message||"");
    }
  } catch(e){ lastErr = (e && (e.name+":"+e.message).slice(0,80)) || "err"; }
};

/* ---- スキャナ (960縮小 → フル解像度 → 中央50%クロップ の多段) ---- */
let scans=0, dets=0, lastText="", lastAt=0, lastBinLen=0, lastState="none", lastPass="";
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
function tryScan(sx,sy,sw,sh,dw,dh){
  canvas.width=dw; canvas.height=dh;
  ctx.drawImage(video,sx,sy,sw,sh,0,0,dw,dh);
  const img=ctx.getImageData(0,0,dw,dh);
  return jsQR(img.data,dw,dh);
}
setInterval(function(){
  const w=video.videoWidth,h=video.videoHeight;
  if(!w||!h||video.readyState<2){ lastState="novideo"; return; }
  $("dim").textContent=w+"x"+h;
  scans++; $("scans").textContent=scans;
  let code=null, pass="";
  try{
    const s=Math.min(1,960/w);
    code=tryScan(0,0,w,h,Math.round(w*s),Math.round(h*s));       pass="960";
    if(!code){ code=tryScan(0,0,w,h,w,h);                        pass="full"; }
    if(!code){ code=tryScan(w/4,h/4,w/2,h/2,w,h);                pass="crop2x"; }
  }catch(e){ lastState="taint"; $("det").textContent="canvas汚染: "+e.name; return; }
  if(!code){ lastState="nodetect"; $("det").textContent="なし (960/full/crop2x 全て)"; $("det").className="ng"; return; }
  dets++;
  lastState="detect"; lastPass=pass;
  lastBinLen=(code.binaryData&&code.binaryData.length)||0;
  $("det").textContent="検出 #"+dets+" ["+pass+"] data.len="+(code.data||"").length; $("det").className="ok";
  $("bin").textContent=lastBinLen+" bytes: "+Array.from(code.binaryData||[]).slice(0,12).map(b=>b.toString(16).padStart(2,"0")).join(" ")+"…";
  const text=decodeQrText(code);
  if(text){ lastText=text; lastAt=Date.now(); $("decoded").textContent=text; $("clock").textContent=mmss(lastAt); }
},700);

/* ---- フレーム送信: 12秒ごとに 480px JPEG をチャンク分割 GET でログへ ---- */
let frameSeq=0;
setInterval(function(){
  const w=video.videoWidth,h=video.videoHeight;
  if(!w||!h) return;
  frameSeq++;
  const fw=480, fh=Math.round(h*480/w);
  const fc=document.createElement("canvas"); fc.width=fw; fc.height=fh;
  fc.getContext("2d").drawImage(video,0,0,fw,fh);
  const b64=fc.toDataURL("image/jpeg",0.5).split(",")[1]
    .replace(/\+/g,"-").replace(/\//g,"_");   // base64url
  const CH=3800, n=Math.ceil(b64.length/CH);
  for(let i=0;i<n;i++){
    fetch("/qr-frame?seq="+frameSeq+"&i="+i+"&n="+n+"&d="+b64.slice(i*CH,(i+1)*CH)).catch(function(){});
  }
},12000);

/* ---- サーバーログへの診断ビーコン (3秒ごと・404でもログに残る) ---- */
setInterval(function(){
  const q="/qr-dbg?v=3&st="+lastState+"&sc="+scans+"&det="+dets+"&bin="+lastBinLen+
    "&dim="+(video.videoWidth||0)+"x"+(video.videoHeight||0)+
    "&pc="+pc.connectionState+"&ws="+wsState+"&pass="+lastPass+
    "&err="+encodeURIComponent(lastErr.slice(0,60))+
    "&txt="+encodeURIComponent(lastText.slice(0,60));
  fetch(q).catch(function(){});
},3000);
</script>
</body>
</html>
